# The probes: what a boot of this machine costs and where, and whether its firmware runs it.
# They boot VMs, need /dev/kvm and a built release, and print what they found; `go test ./...`
# skips every one of them unless its SPIN_* switch is set, which is what these targets do.
#
# Each one's question, and what it answered, is in its test file's doc comment. They run on
# the lab runner through .github/workflows/lab.yml, against a published release and optionally
# a kernel or QEMU built from a branch; a laptop is not a quiet enough host to compare boots.
#
# Every probe boots the release tree OUTPUT_DIR names (the lab points it at the release it
# unpacked), with the spin-machine this checkout builds.

version: '3'

env:
  SPIN_MACHINE_OUTPUT: '{{.OUTPUT_ABS}}'

tasks:
  roms:
    desc: >-
      Hold the fingerprint to every read-only block a started machine maps: the BIOS by its
      file's size, the rest the machine type's own (machine.BIOSBlock, machine.MachineBlocks).
      Needs a built release and /dev/kvm.
    deps: [':tools']
    cmds:
      - SPIN_ROM_TEST=1 go test ./boot/ -run '^TestEveryROMIsTheFingerprints$' -count=1 -v -timeout 3m

  previous:
    desc: >-
      Fetch the newest published release, or PREVIOUS=<version>, into _output/compat/<version>/,
      checked against its sha256 and its signature, and write the path of its
      usr/share/spin-stack to _output/compat/previous: the machine boot:compat resumes from.
    vars:
      PREVIOUS: '{{.PREVIOUS | default ""}}'
    cmds:
      - |
        set -euo pipefail
        tag='{{.PREVIOUS}}'
        if [ -z "$tag" ]; then tag=$(gh release view -R spin-stack/spin-machine --json tagName -q .tagName); fi
        dir={{.OUTPUT_ABS}}/compat/$tag
        name="spin-machine-${tag}-linux-x86_64"
        if [ ! -f "$dir/$name/usr/share/spin-stack/machine.env" ]; then
          rm -rf "$dir" && mkdir -p "$dir"
          gh release download "$tag" -R spin-stack/spin-machine -D "$dir" \
            -p "$name.tar.gz" -p "$name.tar.gz.sha256" -p "$name.tar.gz.sigstore.json"
          (cd "$dir" && sha256sum -c "$name.tar.gz.sha256")
          # cosign by its pin, built rather than installed by the action: one pin for a laptop
          # and a runner alike.
          go run "github.com/sigstore/cosign/v3/cmd/cosign@$(versions version cosign)" verify-blob \
            --bundle "$dir/$name.tar.gz.sigstore.json" \
            --certificate-identity https://github.com/spin-stack/spin-machine/.github/workflows/release.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$dir/$name.tar.gz"
          tar -xzf "$dir/$name.tar.gz" -C "$dir"
        fi
        echo "$dir/$name/usr/share/spin-stack" > {{.OUTPUT_ABS}}/compat/previous

  buildkit:
    desc: >-
      Use the BuildKit builder named compat, made the first time: a docker-container builder,
      which reads and exports a cache (CACHE_BACKEND) where Docker's own cannot.
    cmds:
      - docker buildx inspect compat > /dev/null 2>&1 && docker buildx use compat || docker buildx create --use --name compat --driver docker-container

  here:
    desc: >-
      The machine before (boot:previous) and this one: the newest release with this tree's QEMU,
      kernel and spin-machine in place of its own, in _output/compat/here. Both are exported to
      the steps after in CI (SPIN_COMPAT_PREVIOUS, SPIN_MACHINE_OUTPUT). Needs a built QEMU,
      kernel and tools.
    # The base image is the release's: a checkpoint resumes with the disks it was saved with. So
    # are the e2fsprogs tools that edit a copy of it (boot:lockdown's debugfs), which is why bin/
    # loses only what this tree replaces; the release's TCG QEMU goes with its QEMU.
    cmds:
      - task: previous
      - |
        set -euo pipefail
        previous=$(cat {{.OUTPUT_ABS}}/compat/previous)
        here={{.OUTPUT_ABS}}/compat/here
        rm -rf "$here" && cp -as "$previous" "$here"
        rm -rf "$here"/bin/qemu-* "$here/qemu" "$here/kernel"
        mkdir -p "$here/kernel"
        cp {{.OUTPUT_ABS}}/bin/qemu-system-x86_64 {{.OUTPUT_ABS}}/bin/qemu-img {{.OUTPUT_ABS}}/bin/spin-machine "$here/bin/"
        cp -r {{.OUTPUT_ABS}}/qemu "$here/qemu"
        cp {{.OUTPUT_ABS}}/kernel/vmlinux "$here/kernel/vmlinux"
        {
          echo "SPIN_COMPAT_PREVIOUS=$previous"
          echo "SPIN_MACHINE_OUTPUT=$here"
        } >> "${GITHUB_ENV:-/dev/stdout}"

  compat:
    desc: >-
      A checkpoint the newest published release saves resumes on this tree's build, when the two
      have one fingerprint (machine.Spec.Fingerprint); PREVIOUS=<version> names another release
      (boot:previous). Needs a built release and /dev/kvm.
    deps:
      - ':tools'
      - task: previous
        vars: {PREVIOUS: '{{.PREVIOUS}}'}
    cmds:
      - SPIN_COMPAT_PREVIOUS="$(cat {{.OUTPUT_ABS}}/compat/previous)" go test ./boot/ -run '^TestACheckpointOfTheReleaseBeforeResumesHere$' -count=1 -v -timeout 10m

  page-cache:
    desc: >-
      The page caches a machine has: a guest writing, reading and removing a file, with QEMU's
      memory and the overlay's and the base image's pages in the host's cache at each step, and
      what the host's copy is worth to a guest reading a file and 8 KiB files back, the disk as
      it is against --disk-direct-over-backing; and memory.reclaim asked for a file read once
      beside a working set read twice. Needs /dev/kvm, a built release
      and sudo. REPS= boots per variant, FILE_MB= the guest's file, CACHE_TIMEOUT_S= a boot's
      limit.
    deps: [':tools']
    cmds:
      - SPIN_PAGE_CACHE=1 go test ./boot/ -run '^TestPageCache$' -count=1 -v -timeout 60m

  logind:
    desc: >-
      Check first SSH login, reconnect, user services and logout in a disposable guest.
      Needs a built release; uses KVM when available, otherwise TCG.
      The image starts logind at boot, for spin's lingering manager, and this checks that
      logins get a real session. SPIN_LOGIND_NO_SEATS=1 holds logind back from the boot and
      removes the drop-in that lets an early login still activate it, and is expected to
      fail, not to measure anything.
    deps: [':tools']
    cmds:
      - SPIN_LOGIND_TEST=1 go test ./boot/ -run '^TestLogindSessions$' -count=1 -v -timeout 5m

  lockdown:
    desc: >-
      Check the guest kernel runs lockdown at confidentiality and the BPF LSM, and has no
      /dev/mem or /proc/kcore, in a disposable guest. Needs a built release; uses KVM when
      available, otherwise TCG.
    deps: [':tools']
    cmds:
      - SPIN_LOCKDOWN_TEST=1 go test ./boot/ -run '^TestTheGuestKernelIsLockedDown$' -count=1 -v -timeout 5m

  hotadd:
    desc: >-
      Check a core attached while an init of the consumer's is PID 1, before systemd and its
      udev start, is online once they have, in a disposable guest. Needs a built release; uses
      KVM when available, otherwise TCG.
    deps: [':tools']
    cmds:
      - SPIN_HOTADD_TEST=1 go test ./boot/ -run '^TestACoreAttachedBeforeSystemdStartsComesOnline$' -count=1 -v -timeout 5m

  initcalls:
    desc: >-
      Where the kernel's own boot goes, initcall by initcall, as a p50 over REPS boots.
      Needs KVM, a built release and sudo. It boots with the console silent and reads the
      ring buffer afterwards, because initcall_debug on a serial console puts a VM exit
      inside every interval it reports. TOP= how many rows, REPS= how many boots.
    deps: [':tools']
    cmds:
      - SPIN_INITCALL_PROBE=1 go test ./boot/ -run TestKernelInitcalls -count=1 -v -timeout 30m

  waits:
    desc: >-
      What waited on what between the kernel handing over and a login prompt, on the host's
      clock: each unit's own time against the lag before it started, the critical path to the
      login that accounts for every millisecond of it, the intervals no unit was working, and
      what is still starting behind the prompt. Read after the boot from systemd's timestamps.
      Needs KVM, a built release and sudo. REPS= boots, TARGET= the login unit, TOP= rows,
      GAP= the shortest idle interval in ms, RAW=<dir> keeps each boot's dump.
    deps: [':tools']
    cmds:
      - SPIN_BOOT_WAITS=1 go test ./boot/ -run '^TestBootWaits$' -count=1 -v -timeout 20m

  ssh-first:
    desc: >-
      When a workspace can first be logged into from the host over SSH, through the machine's
      vsock: sshd accepting, the first login done, a second login's cost, and the console
      prompt beside them, logged in with golang.org/x/crypto/ssh over ML-KEM, the one key
      exchange the image's sshd accepts. Needs KVM, /dev/vhost-vsock (task vsock), a built
      release and sudo. REPS= boots.
    deps: [':tools']
    cmds:
      - SPIN_SSH_FIRST=1 go test ./boot/ -run '^TestFirstSSH$' -count=1 -v -timeout 30m

  firmware-stages:
    desc: >-
      Where the time before the kernel goes on the machine a workspace boots: QEMU's start and
      each of the firmware's steps (PCI walk, fw_cfg directory, ACPI, e820, SMBIOS, command
      line, initrd), from QEMU's own trace of the firmware's fw_cfg selects and exits. Needs
      KVM and a built release; no sudo. REPS= boots, FLAGS= the machine's spin-machine flags.
    deps: [':tools']
    cmds:
      - SPIN_FIRMWARE_STAGES=1 go test ./boot/ -run '^TestFirmwareStages$' -count=1 -v -timeout 20m

  firmware:
    desc: >-
      Whether the machine's firmware runs it: qboot boots, publishes vmgenid's table and
      survives a restore with the guest reseeding - a firmware with no WRITE_POINTER loses
      vmgenid, and a lost vmgenid has no symptom - and SeaBIOS, the fallback, still boots.
      Needs KVM and a built release; SPIN_PROBE_INITRD= names a diagnostic initrd, and
      without it boot/probeinit is built into one.
    deps: [':tools']
    cmds:
      - SPIN_FIRMWARE_PROBE=1 go test ./boot/ -run '^TestFirmwareRuns$' -count=1 -v -timeout 20m

