version: '3'

# The guest kernel. See kernel/Dockerfile; the kernel and its toolchain are pinned in
# versions.yaml, and KERNEL_ARCH is the root Taskfile.yml's.
#
# A changed kernel is every guest's next boot: a resumed guest runs the kernel in its saved
# memory, so the fingerprint, the machine's contract, does not hash it and checkpoints keep
# resuming. A config change is still every guest's kernel once they reboot, and is a deliberate
# commit with a measurement in it.

# The pinned version's series, major.minor, which names the configuration: every release of a
# series builds from one file, so a stable release is a versions.yaml line and nothing else. The
# builds are handed the version itself by `versions args`; see the note in qemu/Taskfile.yml.
vars:
  KERNEL_SERIES:
    sh: go tool versions version kernel | cut -d. -f1,2
  # Where task kernel:cves keeps the CNA's records and the release it judges.
  CVES: '{{.OUTPUT_ABS}}/cves'

tasks:

  build:
    desc: Build the guest kernel (vmlinux, PVH, stripped) into _output/.
    cmds:
      - mkdir -p {{.OUTPUT_ABS}}
      - |
        docker buildx build \
          --file kernel/Dockerfile \
          --target kernel \
          --platform linux/amd64 \
          --cache-from {{.KERNEL_CACHE_FROM}} \
          {{.KERNEL_CACHE_TO}} \
          $({{.VERSIONS}} args debian debian-snapshot kernel moby-check-config) \
          --build-arg KERNEL_SERIES={{.KERNEL_SERIES}} \
          --build-arg KERNEL_ARCH={{.KERNEL_ARCH}} \
          --build-arg KERNEL_NPROC={{.KERNEL_NPROC}} \
          --output type=local,dest={{.OUTPUT_ABS}} \
          .
      - task: verify

  verify:
    desc: Assert the built kernel is one QEMU can enter and one this machine can boot.
    cmds:
      - |
        set -euo pipefail
        k={{.OUTPUT_ABS}}/kernel/vmlinux
        test -f "$k" || { echo "no kernel at $k — run: task kernel:build" >&2; exit 1; }
        # The PVH notes are the entry point: there is no bootloader and no UEFI here, and
        # QEMU enters this ELF through pvh.bin using them. The build strips the symbol
        # table, which is the one step that could plausibly take them with it.
        readelf -n "$k" 2>/dev/null | grep -qi xen || {
          echo "$k carries no Xen PVH notes — QEMU has no entry point into it" >&2; exit 1; }
        echo "OK: $k, PVH notes present, sha256 $(sha256sum "$k" | cut -c1-16)…"

  summary:
    desc: What the built kernel and its config are, by sha256, on the run's summary in CI.
    cmds:
      - |
        set -euo pipefail
        {
          echo "kernel sha256: $(sha256sum {{.OUTPUT_ABS}}/kernel/vmlinux | cut -d' ' -f1)"
          echo "config sha256: $(sha256sum {{.OUTPUT_ABS}}/kernel/kernel-config | cut -d' ' -f1)"
        } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

  # What the kernel CNA has published, judged against a kernel's version and what its build
  # compiled (hack/kernelcves). The newest release's by default, because it is what anything takes
  # next, as task osv scans; LOCAL=1 judges the last kernel:build instead, which is how a bump or a
  # config change is compared before it is released.
  cves:
    desc: "What the kernel CNA's published CVEs mean for the newest release's kernel (LOCAL=1: the last kernel:build): fixed, in code it does not compile, or applying and where the fix is. Needs git and the network, and gh and cosign for a release."
    cmds:
      - task: cves:records
      - task: cves:release
        if: '[ -z "{{.LOCAL}}" ]'
      - |
        set -euo pipefail
        if [ -n "{{.LOCAL}}" ]; then v=$(go tool versions version kernel); s={{.OUTPUT_ABS}}/kernel/sources
        else v=$(sed -n 's/^kernel_version=//p' {{.CVES}}/release/machine.env); s={{.CVES}}/release/kernel/sources; fi
        go run ./hack/kernelcves -published {{.CVES}}/vulns/cve/published -version "$v" -sources "$s" |
          tee {{.CVES}}/summary.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        grep '^|' {{.CVES}}/summary.md

  # The kernel CNA's records as they are today: data, read the way task osv reads OSV's database
  # and not an input of a build, so not a pin in versions.yaml. Only cve/published, which is what
  # hack/kernelcves reads, and not the repository's history.
  cves:records:
    desc: Fetch the kernel CNA's published CVE records (git.kernel.org's vulns repository) into _output/cves/vulns, or bring them to today's.
    cmds:
      - |
        set -euo pipefail
        d={{.CVES}}/vulns
        if [ ! -d "$d/.git" ]; then
          git clone -q --depth 1 --sparse https://git.kernel.org/pub/scm/linux/security/vulns.git "$d"
          git -C "$d" sparse-checkout set cve/published
        fi
        git -C "$d" fetch -q --depth 1 origin && git -C "$d" reset -q --hard FETCH_HEAD

  # The tarball and not a file of its own: the sources list is in what a release signs already,
  # and the .sha256's signature is the release's, checked before the tarball is read.
  cves:release:
    desc: Put the newest release's machine.env and kernel/sources in _output/cves/release, once the tarball's signature is the release's. Needs gh and cosign.
    cmds:
      - |
        set -euo pipefail
        tag=$(gh release view --json tagName -q .tagName) d={{.CVES}}/release
        t="spin-machine-${tag}-linux-x86_64.tar.gz"
        rm -rf "$d" && mkdir -p "$d" && gh release download "$tag" -p "$t" -p "$t.sha256" -p "$t.sha256.sigstore.json" -D "$d"
        cosign verify-blob --bundle "$d/$t.sha256.sigstore.json" "$d/$t.sha256" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity https://github.com/spin-stack/spin-machine/.github/workflows/release.yml@refs/heads/main
        (cd "$d" && sha256sum -c --quiet "$t.sha256")
        tar -xzf "$d/$t" -C "$d" --wildcards --strip-components=4 '*/usr/share/spin-stack/machine.env' '*/usr/share/spin-stack/kernel/sources' ||
          { echo "$tag carries no kernel/sources: hack/kernelcves reads releases from the one after kernel/Dockerfile wrote it" >&2; exit 1; }

  menuconfig:
    desc: "Edit the kernel config. Writes back to kernel/config-<series>-<arch>."
    interactive: true
    cmds:
      - |
        docker buildx build \
          --file kernel/Dockerfile \
          --target kernel-build-base \
          --platform linux/amd64 \
          --cache-from {{.KERNEL_CACHE_FROM}} \
          {{.KERNEL_CACHE_TO}} \
          $({{.VERSIONS}} args debian debian-snapshot kernel moby-check-config) \
          --build-arg KERNEL_SERIES={{.KERNEL_SERIES}} \
          --build-arg KERNEL_ARCH={{.KERNEL_ARCH}} \
          --build-arg KERNEL_NPROC={{.KERNEL_NPROC}} \
          --output type=docker,name=spin-machine-menuconfig \
          .
      # KCONFIG_CONFIG is the whole mechanism: kconfig reads and writes that path, so
      # menuconfig opens the repository's config and saves straight back onto it.
      #
      # There is no `cp .config` afterwards, and there must not be. That copy was here, and
      # it copied the *container's* /usr/src/linux/.config — the olddefconfig output the
      # image was built with — over the file menuconfig had just written. Every edit was
      # discarded, and the task exited 0 while doing it.
      - |
        docker run --rm -it \
          -v {{.ROOT_DIR}}/kernel:/config \
          -w /usr/src/linux \
          -e KCONFIG_CONFIG=/config/config-{{.KERNEL_SERIES}}-{{.KERNEL_ARCH}} \
          -e TERM=${TERM:-xterm-256color} \
          spin-machine-menuconfig \
          make ARCH={{.KERNEL_ARCH}} menuconfig
