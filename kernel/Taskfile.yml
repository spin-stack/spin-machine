version: '3'

# The guest kernel. See kernel/Dockerfile; the kernel and its toolchain are pinned in
# versions.yaml, and KERNEL_ARCH is the root Taskfile.yml's.
#
# A changed kernel is every guest's next boot: a resumed guest runs the kernel in its saved
# memory, so the fingerprint, the machine's contract, does not hash it and checkpoints keep
# resuming. A config change is still every guest's kernel once they reboot, and is a deliberate
# commit with a measurement in it.

# The pinned version, for the name of the configuration file menuconfig writes. The builds
# are handed it by `versions args`; see the note in qemu/Taskfile.yml.
vars:
  KERNEL_VERSION:
    sh: go tool versions version kernel

tasks:

  build:
    desc: Build the guest kernel (vmlinux, PVH, stripped) into _output/.
    cmds:
      - mkdir -p {{.OUTPUT_ABS}}
      - |
        docker buildx build \
          --file kernel/Dockerfile \
          --target kernel \
          --platform linux/amd64 \
          --cache-from {{.KERNEL_CACHE_FROM}} \
          {{.KERNEL_CACHE_TO}} \
          $({{.VERSIONS}} args debian debian-snapshot kernel moby-check-config) \
          --build-arg KERNEL_ARCH={{.KERNEL_ARCH}} \
          --build-arg KERNEL_NPROC={{.KERNEL_NPROC}} \
          --output type=local,dest={{.OUTPUT_ABS}} \
          .
      - task: verify

  verify:
    desc: Assert the built kernel is one QEMU can enter and one this machine can boot.
    cmds:
      - |
        set -euo pipefail
        k={{.OUTPUT_ABS}}/kernel/vmlinux
        test -f "$k" || { echo "no kernel at $k — run: task kernel:build" >&2; exit 1; }
        # The PVH notes are the entry point: there is no bootloader and no UEFI here, and
        # QEMU enters this ELF through pvh.bin using them. The build strips the symbol
        # table, which is the one step that could plausibly take them with it.
        readelf -n "$k" 2>/dev/null | grep -qi xen || {
          echo "$k carries no Xen PVH notes — QEMU has no entry point into it" >&2; exit 1; }
        echo "OK: $k, PVH notes present, sha256 $(sha256sum "$k" | cut -c1-16)…"

  summary:
    desc: What the built kernel and its config are, by sha256, on the run's summary in CI.
    cmds:
      - |
        set -euo pipefail
        {
          echo "kernel sha256: $(sha256sum {{.OUTPUT_ABS}}/kernel/vmlinux | cut -d' ' -f1)"
          echo "config sha256: $(sha256sum {{.OUTPUT_ABS}}/kernel/kernel-config | cut -d' ' -f1)"
        } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

  menuconfig:
    desc: "Edit the kernel config. Writes back to kernel/config-<version>-<arch>."
    interactive: true
    cmds:
      - |
        docker buildx build \
          --file kernel/Dockerfile \
          --target kernel-build-base \
          --platform linux/amd64 \
          --cache-from {{.KERNEL_CACHE_FROM}} \
          {{.KERNEL_CACHE_TO}} \
          $({{.VERSIONS}} args debian debian-snapshot kernel moby-check-config) \
          --build-arg KERNEL_ARCH={{.KERNEL_ARCH}} \
          --build-arg KERNEL_NPROC={{.KERNEL_NPROC}} \
          --output type=docker,name=spin-machine-menuconfig \
          .
      # KCONFIG_CONFIG is the whole mechanism: kconfig reads and writes that path, so
      # menuconfig opens the repository's config and saves straight back onto it.
      #
      # There is no `cp .config` afterwards, and there must not be. That copy was here, and
      # it copied the *container's* /usr/src/linux/.config — the olddefconfig output the
      # image was built with — over the file menuconfig had just written. Every edit was
      # discarded, and the task exited 0 while doing it.
      - |
        docker run --rm -it \
          -v {{.ROOT_DIR}}/kernel:/config \
          -w /usr/src/linux \
          -e KCONFIG_CONFIG=/config/config-{{.KERNEL_VERSION}}-{{.KERNEL_ARCH}} \
          -e TERM=${TERM:-xterm-256color} \
          spin-machine-menuconfig \
          make ARCH={{.KERNEL_ARCH}} menuconfig
