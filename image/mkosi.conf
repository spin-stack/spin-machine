# The base image: the userland a workload runs in, as a filesystem instead of a stack of
# tar layers.
#
# This is spinbox's images/sandbox, ported. That image is an Ubuntu 26.04 tree with systemd
# as the container's PID 1, the development tools a workspace expects, and a long list of
# boot optimizations that were each measured — masked units, disabled generators, a
# volatile journal, a pre-warmed ldconfig (see usr/local/lib/spin-base/optimize-systemd.sh,
# where every mask carries the milliseconds it saved). None of that was reinvented here.
# What changed is the container it arrives in.
#
# Why mkosi and not `docker build`: the output wanted is a filesystem image, not a stack of
# tar layers. Today containerd's erofs-snapshotter turns those layers into an erofs inside
# a VMDK plus a raw ext4 writable layer, stacked with overlayfs in the guest. The
# replacement is a read-only qcow2 base with a fresh qcow2 overlay per VM, so copy-on-write
# moves from the filesystem to the block layer, where QEMU does it. A build that produces
# the filesystem directly skips the round trip.
#
# systemd is in here, and the briefing for this repository said the image has no init. Both
# are true and it is worth being precise about which: the *machine* does not boot this. The
# guest kernel boots an initrd spinbox builds, whose /init is vminitd, and the container's
# filesystem is mounted under that at a bundle path and entered with chroot. The systemd in
# this image is the container's first process, which is what `ENTRYPOINT ["/sbin/init"]`
# meant in the Dockerfile and what the containerd integration lane starts. Nothing here is
# designed around crun's bundle semantics either — spinbox is growing a path that chroots
# and execs with no OCI runtime at all (internal/guest/vminit/process/direct.go), and this
# image does not care which one runs it.
#
# Format=directory, and image/build.sh turns the tree into a partitionless ext4 and wraps
# it in qcow2. mkosi has no output format that is "one filesystem, no partition table", and
# a bootable disk with an ESP and a GPT is exactly what nothing here would read: there is
# no bootloader and no UEFI in this machine, the kernel is entered directly through pvh.bin.

[Config]
MinimumVersion=25.3

[Build]
# The package cache survives between builds; the tree does not. Rebuilding this image is
# an apt install of ~1.5 GB and the archive is the slow part.
Incremental=yes
CacheDirectory=/cache
WithNetwork=yes

[Distribution]
Distribution=ubuntu
# 26.04 LTS, the same release spinbox's sandbox Dockerfile pins with `FROM ubuntu:26.04`.
Release=resolute
Repositories=main,restricted,universe,multiverse

[Output]
Format=directory
OutputDirectory=/work/out
Output=rootfs
ImageId=spin-base

[Content]
# Copied after the packages are installed and before mkosi.postinst.chroot runs. Everything
# in it lands under /usr/local/lib/spin-base and is put in place, or deleted, by that
# script — nothing here is delivered to its final path directly. The reason is
# /etc/containerd/config.toml: containerd.io ships it as a conffile and installs during the
# post-installation script, so a copy already sitting at that path stops the build at a
# conffile prompt with no tty. See mkosi.postinst.chroot.
ExtraTrees=mkosi.extra

WithDocs=no
# Kept, unlike a minimal image: this is a development sandbox and a workload in it runs
# apt. Removing dpkg's database would save ~25 MB and take `apt install` with it.
CleanPackageMetadata=no

# The package list from spinbox's images/sandbox/Dockerfile, plus the handful the base
# would have inherited from `FROM ubuntu:26.04` and that mkosi has to be told about.
Packages=
        # --- what the container image assumed it had ---
        apt
        dpkg
        coreutils
        login
        passwd
        adduser
        locales
        findutils
        # locale-gen and iconvconfig are called by optimize-systemd.sh's cache pre-warm.

        # --- systemd as the container's PID 1 ---
        systemd
        systemd-sysv
        dbus-broker
        udev

        # --- access ---
        openssh-server
        sudo

        # --- the workspace's tools ---
        git
        curl
        wget
        ca-certificates
        make
        jq
        nano
        less
        strace
        btop

        # --- shells and text ---
        bash
        sed
        gawk
        grep
        diffutils
        gzip
        xz-utils

        # --- process and system ---
        procps
        util-linux
        kmod
        pciutils
        ethtool
        qemu-guest-agent

        # --- network ---
        iproute2
        net-tools
        iputils-ping
        dnsutils
        netcat-openbsd
        iptables
        arptables
        ebtables
        nftables

        # --- container storage ---
        # fuse-overlayfs is Docker's storage driver here (etc/docker/daemon.json): the
        # container is already inside a VM and its root is a qcow2 overlay, so the kernel
        # overlayfs a nested docker would want is a second layer on top of one.
        fuse-overlayfs
        isal
        pigz

# No identity. spinbox restores VMs from a frozen template and hands each one its identity
# afterwards over RPC; anything baked in here is shared by every VM that ever boots from
# this image — and there are many, all reading this one file through a qcow2 backing chain.
#
# /etc/resolv.conf is the sharpest of these: the guest bind-mounts one in and deliberately
# refuses to bind-mount over a file that is not there, so a stale one baked in would be the
# one every container reads.
#
# /etc/machine-id is not in this list and is handled in image/build.sh instead: it has to
# exist and be *empty*, which is neither "present" nor "absent".
RemoveFiles=
        /etc/hostname
        /etc/resolv.conf
        /etc/ssh/ssh_host_*
        /var/lib/dbus/machine-id
        /var/log/journal
        /var/cache/apt/archives
