# The base image: the userland a workload runs in, as a filesystem instead of a stack of
# tar layers.
#
# An Ubuntu 26.04 tree with systemd as the container's PID 1, the development tools a
# workspace expects, and a long list of boot optimizations that were each measured — masked
# units, disabled generators, a volatile journal, a pre-warmed ldconfig. See
# usr/local/lib/spin-base/optimize-systemd.sh, where every mask carries the milliseconds it
# saved; it is an unmodified copy of a script that earned those numbers, which is why it
# reads like a script and not like mkosi configuration.
#
# Why mkosi and not a container image build: what is wanted is a filesystem image, not a
# stack of tar layers. This image is a read-only qcow2 base with a fresh qcow2 overlay per
# VM, so copy-on-write happens in the block layer where QEMU does it, rather than in a
# filesystem stacked inside the guest. A build that produces the filesystem directly skips
# the round trip through layers and back.
#
# systemd is in here and the machine still has no init of its own. Both are true and the
# distinction matters: this is not what the *machine* boots. The kernel boots an initrd,
# and the software in that initrd mounts this image and enters it. The systemd here is the
# first process of whatever runs inside — nothing more privileged than that.
#
# Nothing here is designed around an OCI runtime's bundle semantics either. The image is a
# filesystem a process is chrooted into; whether a runtime or a plain exec puts it there is
# not this image's business.
#
# Format=directory, and image/build.sh turns the tree into a partitionless ext4 and wraps
# it in qcow2. mkosi has no output format that is "one filesystem, no partition table", and
# a bootable disk with an ESP and a GPT is exactly what nothing here would read: there is
# no bootloader and no UEFI in this machine, the kernel is entered directly through pvh.bin.

[Config]
# The version image/Dockerfile pins, not a floor with room above it: mkosi decides what
# ends up in the tree, so a build that ran with a different one built a different image.
# If the two ever disagree, this is what says so.
MinimumVersion=27

[Build]
# The package cache survives between builds; the tree does not. Rebuilding this image is
# an apt install of ~1.5 GB and the archive is the slow part.
Incremental=yes
CacheDirectory=/cache
WithNetwork=yes

[Distribution]
Distribution=ubuntu
# 26.04 LTS, pinned. A distribution release is part of what a workload finds inside.
Release=resolute
Repositories=main,restricted,universe,multiverse

[Output]
Format=directory
OutputDirectory=/work/out
Output=rootfs
ImageId=spin-base

[Content]
# Copied after the packages are installed and before mkosi.postinst.chroot runs. Everything
# in it lands under /usr/local/lib/spin-base and is put in place, or deleted, by that
# script — nothing here is delivered to its final path directly. The reason is
# /etc/containerd/config.toml: containerd.io ships it as a conffile and installs during the
# post-installation script, so a copy already sitting at that path stops the build at a
# conffile prompt with no tty. See mkosi.postinst.chroot.
ExtraTrees=mkosi.extra

# No documentation in the image, but the per-package copyright files survive this: mkosi
# excludes /usr/share/doc/* and includes /usr/share/doc/*/copyright, which is exactly the
# right split. They are collected by mkosi.postinst.chroot before a later script deletes
# them; see there.
WithDocs=no
# Kept, unlike a minimal image: this is a development sandbox and a workload in it runs
# apt. Removing dpkg's database would save ~25 MB and take `apt install` with it.
CleanPackageMetadata=no

# The workload's userland, plus the handful of packages a container image would have
# inherited from its base and that mkosi has to be told about explicitly.
Packages=
        # --- what the container image assumed it had ---
        apt
        dpkg
        coreutils
        login
        passwd
        adduser
        locales
        findutils
        # locale-gen and iconvconfig are called by optimize-systemd.sh's cache pre-warm.

        # --- systemd as the container's PID 1 ---
        systemd
        systemd-sysv
        dbus-broker
        udev

        # --- access ---
        openssh-server
        sudo

        # --- the workspace's tools ---
        git
        curl
        wget
        ca-certificates
        make
        jq
        nano
        less
        strace
        btop
        # file, because scripts branch on what it says and a `command not found` in that
        # position reads as the archive being wrong rather than the tool being absent.
        file

        # --- shells and text ---
        bash
        sed
        gawk
        grep
        diffutils
        # patch beside diffutils: the two halves of the same job, and only one of them
        # arrived with the package that brings `diff`.
        patch
        gzip
        xz-utils
        # unzip, because .zip is what a release asset downloaded with curl usually is, and
        # tar cannot open one. There is no zip here: nothing in a workspace produces them.
        unzip

        # --- the clock ---
        #
        # Nothing. There is no time daemon in this image, and that is the decision, not an
        # omission.
        #
        # A booted VM does not need one: kvm-clock hands the guest the host's wall clock, and
        # with every time daemon masked the guest's clock lands inside the host-measured boot
        # window, correct to about 100 ms (measured 2026-09-10, host reading before the
        # launch and after the power-off, guest reading in between).
        #
        # A VM restored from a frozen template does need one, because it wakes with the wall
        # clock the template was frozen at — arbitrarily far in the past, and not shaped like
        # a clock problem when it surfaces: TLS certificates that are not yet valid, package
        # signatures rejected, tokens that expire on arrival.
        #
        # But correcting that needs one fact this machine cannot have: that it was restored.
        # A restore is invisible from the inside — that is what makes it a restore — so only
        # whoever performed it knows, and whoever performs it is not this repository. It is
        # the same division as the init: a release is not bootable on its own, and it is not
        # correct on its own either. The host reads /dev/ptp0 through the guest it brought,
        # or it does not, and either way the choice is not made here.
        #
        # chrony was here until 2026-09-10 doing exactly that job from inside, with
        # `refclock PHC /dev/ptp0` and `makestep 0.1 -1`, and it worked. What it could never
        # do was know when to hurry: its own configuration said so, that the exposure is the
        # window between a restore and chronyd's next sample, and that it belongs to whoever
        # performs the restore. Keeping a daemon that cannot answer the question it exists
        # for costs 10 ms of every boot and a package in every image.
        #
        # systemd-timesyncd is not the smaller version of this. It is an SNTP client and
        # nothing else — no refclock, no PHC, verified as zero matches for refclock/ptp/phc
        # in its binary against eleven in chronyd's — so it can only ask a server over a
        # network this machine may not have, more slowly and less accurately than reading the
        # host's own clock. It stays masked.

        # --- process and system ---
        procps
        util-linux
        kmod
        pciutils
        ethtool

        # --- network ---
        iproute2
        net-tools
        iputils-ping
        dnsutils
        netcat-openbsd
        iptables
        arptables
        ebtables
        nftables

        # --- container storage ---
        isal
        pigz

# No identity. A VM restored from a frozen template is handed its identity afterwards;
# anything baked in here is shared by every VM that ever boots from this image — and there
# are many, all reading this one file through a qcow2 backing chain.
#
# /etc/resolv.conf is the sharpest of these: the guest bind-mounts one in and deliberately
# refuses to bind-mount over a file that is not there, so a stale one baked in would be the
# one every container reads.
#
# /etc/machine-id is not in this list and is handled in image/build.sh instead: it has to
# exist and be *empty*, which is neither "present" nor "absent".
RemoveFiles=
        /etc/hostname
        /etc/resolv.conf
        /etc/ssh/ssh_host_*
        /var/lib/dbus/machine-id
        /var/log/journal
        /var/cache/apt/archives
