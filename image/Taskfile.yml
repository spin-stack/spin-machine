version: '3'

# The base image. See image/mkosi.conf for what goes into it and image/build.sh for how the
# tree becomes a partitionless ext4 in a read-only qcow2.

tasks:

  build:
    desc: Build base.qcow2 (Ubuntu 26.04 userland, ext4, partitionless) into _output/.
    cmds:
      - task: builder
      - mkdir -p {{.OUTPUT_ABS}} {{.MKOSI_CACHE_DIR}}
      # `docker run` and not `docker buildx build`, and the reason is in image/Dockerfile:
      # mkosi assembles a root filesystem by unsharing a user and mount namespace and
      # BuildKit forbids that. The flags below are exactly what it needs and nothing more —
      # not --privileged.
      - |
        docker run --rm \
          --security-opt seccomp=unconfined \
          --security-opt apparmor=unconfined \
          --cap-add SYS_ADMIN \
          -v {{.OUTPUT_ABS}}:/out \
          -v {{.MKOSI_CACHE_DIR}}:/cache \
          {{.IMAGE_BUILDER_TAG}}

  builder:
    desc: Build the container that builds the base image (mkosi, e2fsprogs, qemu-utils).
    cmds:
      - |
        docker buildx build \
          --file image/Dockerfile \
          --platform linux/amd64 \
          --cache-from {{.IMAGE_CACHE_FROM}} \
          --cache-to {{.IMAGE_CACHE_TO}} \
          --tag {{.IMAGE_BUILDER_TAG}} \
          --load \
          .

  shell:
    desc: >-
      Boot this machine and get a shell inside the base image. INIT=/sbin/init boots systemd
      instead; MEMORY and CPUS override the defaults.
    interactive: true
    deps: [':tools']
    vars:
      # systemd, because that is what this image is: a userland whose first process is
      # /sbin/init. Booting a bare shell instead answers a different question than the one
      # `task shell` is for — `systemd-analyze` in it replies "System has not been booted
      # with systemd as init system (PID 1)", which is true and useless. INIT=/bin/bash is
      # still there for when systemd is the thing that is broken.
      INIT: '{{.INIT | default "/sbin/init"}}'
      MEMORY: '{{.MEMORY | default "2048"}}'
      CPUS: '{{.CPUS | default "2"}}'
    cmds:
      # Booted through _output/bin/spin-machine, which builds its command line from the
      # machine package next door. That is the point of running it this way rather than
      # writing the QEMU line here: the definition of the machine is executed by this
      # repository, so a slot map or a kernel argument that stopped working stops working
      # here first.
      - |
        set -euo pipefail
        out={{.OUTPUT_ABS}}
        for f in "$out/bin/spin-machine" "$out/bin/qemu-system-x86_64" "$out/vmlinux" \
                 "$out/base.qcow2" "$out/debug-initramfs.cpio.gz"; do
          test -f "$f" || { echo "missing $f — run: task build" >&2; exit 1; }
        done

        # A throwaway overlay, which is both the safe thing and the honest one: it is the
        # exact shape a container's writable layer has (`qemu-img create -f qcow2 -F qcow2
        # -b base`), so everything typed in this shell is written where a container's
        # writes would go, and the base — which every VM maps read-only, many at once —
        # cannot be touched.
        scratch=$(mktemp -d)/scratch.qcow2
        trap 'rm -rf "$(dirname "$scratch")"' EXIT
        "$out/bin/qemu-img" create -f qcow2 -F qcow2 -b "$out/base.qcow2" "$scratch" >/dev/null

        before=$(sha256sum "$out/base.qcow2" | cut -d' ' -f1)

        echo "booting {{.INIT}} in the base image — {{.MEMORY}} MiB, {{.CPUS}} vCPU"
        echo "  writes go to a throwaway overlay; the base is read-only and checked after"
        case "{{.INIT}}" in
          */init) echo "  systemd; the console autologins as root (the image carries no password)" ;;
        esac
        echo "  leave with: 'poweroff -f', or Ctrl-A then X"
        echo

        # -initrd, and not `root=/dev/vda init=…` straight into the image.
        #
        # A kernel handed a root filesystem and a shell mounts neither /proc nor /sys, so
        # `df` warns, `free` fails and `poweroff` answers "Running in chroot, ignoring
        # request". That is what PID 1 gets before an init has run — not a fault in the
        # image, and in production it is the guest's own init that fixes it. Here it is
        # cmd/spin-machine-init: mount the four, find the disk, move onto it, exec.
        #
        # spinmachine.getty=1 enables the login unit the image already carries and does
        # not start. systemd gives no serial login on its own here — it starts getty@tty1,
        # a virtual console on a machine whose QEMU has no display adapter compiled in at
        # all. The unit is in the image; the symlink that turns it on is written into this
        # VM's throwaway overlay, because a login prompt on the console the machine prints
        # its kernel log to is a debugging convenience production must not get.
        #
        # accel=kvm with no fallback, from the machine package: the binary in _output/bin
        # cannot emulate, on purpose. A host with no /dev/kvm gets an error here rather
        # than a guest at a tenth of the speed.
        "$out/bin/spin-machine" boot \
          --release "$out" \
          --disk "$scratch" \
          --initrd "$out/debug-initramfs.cpio.gz" \
          --memory {{.MEMORY}} --cpus {{.CPUS}} \
          --append "spinmachine.root=/dev/vda spinmachine.init={{.INIT}} spinmachine.getty=1" || true

        echo
        after=$(sha256sum "$out/base.qcow2" | cut -d' ' -f1)
        if [ "$before" != "$after" ]; then
          echo "👹 the base image changed during that session: $before -> $after" >&2
          echo "   every overlay in existence is now built on a file that moved." >&2
          exit 1
        fi
        echo "base.qcow2 unchanged; the overlay held $(du -h "$scratch" | cut -f1) of writes and is gone"
