# The per-connection sshd waits for the host keys too, not only ssh.service.
#
# systemd-ssh-generator listens on AF_VSOCK port 22 when the machine has a vsock device, and on
# /run/ssh-unix-local/socket (`ssh .host`) always, and both start sshd@.service for each
# connection. spin-machine-sshd-keygen.service was wanted by ssh.service alone, so until
# something had connected over TCP there were no host keys, and the per-connection sshd
# dropped every connection: over vsock the image could not be logged into at all
# (task boot:ssh-first, 2026-11-12).
#
# A drop-in on the template, because an ordering against a template name in the keygen unit
# (Before=sshd@.service) orders nothing: it applies to no instance.
[Unit]
Wants=spin-machine-sshd-keygen.service
After=spin-machine-sshd-keygen.service
