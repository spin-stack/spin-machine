# The first SSH login's lane: the user's manager, which spin's linger starts in the boot.
#
# Without systemd's default dependencies, so this does not wait for sysinit.target (journald,
# udev) or basic.target. Together with the rest of the lane - the vsock socket, the
# per-connection sshd, dbus, logind, the user's runtime directory and manager, all early;
# no /run/nologin at boot and sessions of class user-early-light (configure-system.sh) - the
# first login over vsock came 478 -> 402 ms on the bench fleet (task boot:ssh-first, lab run
# 43518915618, 2026-11-13). Each part alone gained little: the socket early accepted 60 ms
# sooner and the login waited for logind and the user's manager instead.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
