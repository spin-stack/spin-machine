# /tmp at a quarter of memory rather than systemd's half.
#
# What is in a tmpfs belongs to no process, so the OOM killer cannot take it back: at the limit
# it kills whatever it finds instead. That matters here because the image sets MGLRU's
# min_ttl_ms (../../tmpfiles.d/lru-gen.conf), which calls the OOM killer rather than letting a
# guest thrash. Measured 2026-09-28, 1 GiB guest: with tmpfs holding all but 16 MiB, it killed
# the console's getty and the session that filled it, where without min_ttl_ms logins only
# doubled. A quarter leaves the rest of memory to what can be killed or reclaimed, and a /tmp
# that fills up says "No space left on device" to whoever filled it.
#
# Options= replaces the whole list, so it is the shipped unit's with size changed; %% is a
# literal % in a unit file.
[Mount]
Options=mode=1777,strictatime,nosuid,nodev,size=25%%,nr_inodes=1m,x-systemd.graceful-option=usrquota
