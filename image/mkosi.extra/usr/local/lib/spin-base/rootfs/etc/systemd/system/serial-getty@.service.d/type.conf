# The serial login prompt as soon as its getty is started, not once the boot's job queue drains.
#
# The template is Type=idle: systemd forks the getty and holds it until no job is left running.
# That cost nothing while the queue was empty by then, and Type=simple measured within noise of
# it (2026-09-10). Since spin lingers, logind starts user@1000.service and its chain inside the
# boot transaction, and the getty waited for them: 91.8 ms between its fork and its exec in the
# median boot of v20261113.01 (task boot:waits, lab run 43361486792), against 3-5 before.
# Type=simple gives the prompt 77 ms back - 346/358 against 423/441 ms p50/p95 to a login
# prompt, 20 boots interleaved on the bench fleet (task boot:bench, lab run 43362067503).
#
# What Type=idle is for is a prompt not overwritten by the boot's own status lines, and this
# machine's console prints none: the kernel is quiet and systemd shows no status.
[Service]
Type=simple
