# MGLRU's thrashing protection: when the pages used in the last second cannot all be kept, the
# kernel calls the OOM killer instead of evicting and re-reading them. Without it, a guest whose
# memory fills slowly while its programs keep running evicts their code and faults it back in,
# page cache still counts as reclaimable, and the OOM killer never comes: the VM is up and
# answers nothing.
#
# Measured 2026-09-28 with the memory-policy probe (337c08d), 1 GiB, 2 vCPUs, memory taken at ~80 MB/s
# while a session re-read its libraries, 3 boots: the worst SSH login was 611-1785 ms without
# this and 105-106 ms with it, and the process was killed after 11.2 s instead of 13.8. 1000 ms
# is the value the kernel's documentation suggests; the kernel needs CONFIG_LRU_GEN, which
# kernel/Dockerfile asserts.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
