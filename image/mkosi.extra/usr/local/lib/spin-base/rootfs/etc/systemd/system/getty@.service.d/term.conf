# agetty is invoked as `- ${TERM}` and the unit does not set TERM, so it takes whatever PID1
# has. PID1's is `dumb`, set on the kernel command line to stop systemd waiting 334 ms twice
# for a serial port to answer a terminfo query (see machine/cmdline.go). Inheriting that
# would hand every login a terminal with no colours, no clear and no cursor addressing.
#
# linux is what systemd itself picks for a virtual console when nothing says otherwise.
[Service]
Environment=TERM=linux
