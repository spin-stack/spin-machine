# udev's coldplug for the devices something here uses, not for every device the kernel found.
#
# systemd-udev-trigger replays an add for each of ~170 devices at boot - ACPI's 39, sixteen
# memory blocks, bdi, mem, pci, platform - while the first login's lane runs on the same two
# vCPUs: filtered, that login came 436 -> 402 ms on the bench fleet (task boot:ssh-first, lab
# run 43518915618, 2026-11-13). What it keeps: the disk and the network; virtio; misc (vsock,
# fuse, tun) and input (the power button's power-switch tag, which logind's shutdown on
# system_powerdown needs); the clock devices; the serial console; and cpu, because a core a
# consumer attached while its own init was PID 1 is onlined by this replay reaching
# 40-spin-hotadd.rules and by nothing else (task boot:hotadd). Compared device by device
# against the full replay, what differs is the group of /dev/ptmx and /dev/tty (mode 666
# either way), dialout on ttyS1-3 and kmem on /dev/port. A device that arrives later is
# udev's as ever: hotplug is a new event, not a replay.
[Service]
ExecStart=
ExecStart=-udevadm trigger --type=devices --action=add --subsystem-match=block --subsystem-match=net --subsystem-match=virtio --subsystem-match=misc --subsystem-match=input --subsystem-match=rtc --subsystem-match=ptp --subsystem-match=cpu
ExecStart=-udevadm trigger --type=devices --action=add --subsystem-match=tty --sysname-match=ttyS0
