# Why logind is not started at boot, and why this file is what allows that.
#
# pam_systemd decides whether to register a session by calling logind_running(), which is
# access("/run/systemd/seats/"). That is a test for "is this a system with logind", not for
# "is logind up". On a false answer it logs "Skipping logind registration as logind is not
# running" and returns PAM_SUCCESS: the login authenticates and lands with no session at
# all — no XDG_RUNTIME_DIR, no XDG_SESSION_ID, no user manager — and nothing reports an
# error. logind creates that directory itself, so the guard reads false exactly while
# logind has never run, and it never asks logind anything before answering.
#
# Creating the directory here makes the guard tell the truth before logind runs. The rest
# is already in place: this socket carries Service=systemd-logind.service, so the Varlink
# connection pam_systemd then makes is what starts logind. Every login path activates it,
# not only SSH — the console getty and su go through the same module.
#
# Worth 24 ms of boot: 248/275 against 272/294 with logind wanted by multi-user.target,
# p50/p95 over 25 boots each, measured 2026-09-12 with `task boot:bench`. The fork below
# is 4 ms of that (244/264 without it) and buys the sessions; masking logind outright
# would be 7 ms better again and would leave every login without one. `task boot:logind`
# is the test that holds that second half.
#
# ExecStartPre and not RuntimeDirectory=systemd/seats: a unit with no Exec* line never
# applies its execution context, so RuntimeDirectory alone creates nothing at all — and it
# then benchmarks *better*, because what it measures is a machine whose logins have no
# session. Adding ExecStartPre=/bin/true makes the directory appear, which is the proof,
# and also why there is no point avoiding the fork.
[Socket]
ExecStartPre=/bin/mkdir -p /run/systemd/seats
