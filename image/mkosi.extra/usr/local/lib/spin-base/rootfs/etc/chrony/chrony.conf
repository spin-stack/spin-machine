# The clock, taken from the host through the paravirtualised PTP device and from nowhere
# else.
#
# Why it is needed at all: kvm-clock keeps a *running* VM's clock correct, but this machine
# is built to be restored from a frozen template, and a restored VM wakes up with the
# template's wall clock — which can be arbitrarily far in the past. Nothing about that looks
# like a clock problem when it surfaces: it surfaces as TLS certificates that are not yet
# valid, package signatures rejected, and JWTs that expire on arrival.
#
# refclock PHC and no servers, no pool, no NTP over the network. The host already knows the
# time and is already trusted — it chose this VM's kernel — so asking the internet instead
# would add an egress dependency and a slower answer. It also means the clock is correct on
# a machine with no network at all, which is the default here.
#
# /dev/ptp0 rather than /dev/ptp_kvm, and the reason changed on 2026-09-10 without the line
# needing to: the friendly name is a udev symlink, and udev used to be masked here, so only
# the numbered node devtmpfs creates was available. udev runs now, so /dev/ptp_kvm exists
# and would be the safer name — it says which clock rather than which enumeration order.
#
# Left as ptp0 because switching it is a change to a running machine's clock source made on
# the strength of a comment nobody re-measured, and the failure mode is silent: chrony
# disciplines against the wrong device and the wall clock is wrong in a way that surfaces as
# TLS errors somewhere else. If a second PTP device is ever added, this becomes wrong and
# /dev/ptp_kvm becomes the fix.
refclock PHC /dev/ptp0 poll 2 dpoll -2 offset 0 stratum 2

# Step rather than slew whenever the offset is large, and at any time rather than only in
# the first few updates: a VM restored from a template is off by however long the template
# sat on disk, and slewing back a week takes a week.
makestep 0.1 -1

# What is NOT here, so that it is not tried again: chrony-wait.service.
#
# The image carries it, from the distribution, and enabling it looks like the obvious way
# to stop a workload from running before the clock is right. It closes neither half of
# the problem.
#
# A fresh boot does not need it. Even with no chronyd at all — booted init=/bin/bash — the
# guest already has the host's wall clock: 14:56:46 against a host at 14:56:37, measured
# 2026-09-10. CONFIG_RTC_HCTOSYS is off in this kernel, so that is not the CMOS RTC being
# read; it is kvmclock handing the guest the host's time at boot.
#
# A restored VM does need it and would not get it. chrony-wait is Type=oneshot with
# RemainAfterExit=yes, so it ran and completed before the template was frozen, and its
# state is in the memory the restore loads: it does not run a second time. Enabling it
# therefore adds a barrier to every boot — the case that is already correct — and none to
# the restore.
#
# So the exposure is the window between a restore and chronyd's next refclock sample, and
# it belongs to whoever performs the restore: chronyd is already running in the memory
# that was loaded, it steps at any offset over 0.1 s by the line above, and how long that
# takes is bounded by the poll interval below rather than measured here. A restorer that
# cares waits for it before handing the machine a workload; the machine cannot know when
# that moment is, because it does not know it was restored.

driftfile /var/lib/chrony/chrony.drift
rtcsync
