# The clock, taken from the host through the paravirtualised PTP device and from nowhere
# else.
#
# Why it is needed at all: kvm-clock keeps a *running* VM's clock correct, but this machine
# is built to be restored from a frozen template, and a restored VM wakes up with the
# template's wall clock — which can be arbitrarily far in the past. Nothing about that looks
# like a clock problem when it surfaces: it surfaces as TLS certificates that are not yet
# valid, package signatures rejected, and JWTs that expire on arrival.
#
# refclock PHC and no servers, no pool, no NTP over the network. The host already knows the
# time and is already trusted — it chose this VM's kernel — so asking the internet instead
# would add an egress dependency and a slower answer. It also means the clock is correct on
# a machine with no network at all, which is the default here.
#
# /dev/ptp0 rather than /dev/ptp_kvm: the friendly name is a udev symlink, and udev is
# masked in this image because a VM's hardware is fixed and known. devtmpfs creates the
# numbered node without it. If a second PTP device is ever added, this becomes wrong and
# the poll below starts disciplining against the wrong clock.
refclock PHC /dev/ptp0 poll 2 dpoll -2 offset 0 stratum 2

# Step rather than slew whenever the offset is large, and at any time rather than only in
# the first few updates: a VM restored from a template is off by however long the template
# sat on disk, and slewing back a week takes a week.
makestep 0.1 -1

driftfile /var/lib/chrony/chrony.drift
rtcsync
