name: Compat

# Whether a checkpoint the newest release saved resumes on this change's machine, and whether the
# fingerprint still accounts for every ROM the machine maps (boot:compat, boot:roms): after every
# change on main to what a resumed guest is loaded into - the machine's definition, QEMU, the
# kernel, the firmware and their pins - and before every release.
#
# On the KVM runner, because it boots: the newest release is unpacked as the machine before, and
# the machine here is that tree with this change's QEMU, firmware and kernel built over it - the
# base image is the release's, since a checkpoint resumes with the disks it was saved with. The
# builds read and write a BuildKit cache that outlives the run (checkout keeps .cache/), so a
# change that leaves QEMU and the kernel alone rebuilds neither.
#
# The test holds the promise only where it is made: when the two fingerprints differ the contract
# moved on purpose, the test says so and passes, and the release notes say it for the fleet.
#
# Not on a pull request: the KVM runner's job hook refuses that event, since a workflow asking
# for its runners would run a pull request's code as root there. It runs on main after a merge
# that touches the machine, on a dispatch - a branch tried before its pull request merges - and
# as a job release.yml waits for, so no release is published that a checkpoint of the one
# before it does not resume on.

on:
  push:
    branches: [main]
    paths:
      - machine/**
      - cmd/spin-machine/**
      - qemu/**
      - kernel/**
      - boot/compat_test.go
      - boot/roms_test.go
      - versions.yaml
      - .github/workflows/compat.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Per ref and never cancelled: a run on main is a commit somebody needs the answer for, and a
# release's waits on it. Called from release.yml it is the release's job and takes its group.
concurrency:
  group: compat-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  compat:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # .cache/buildkit is the runner's QEMU and kernel cache; a clean checkout would empty it.
          clean: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # A builder that can export its cache to the directory above; the runner keeps it.
      - name: A BuildKit that keeps its cache
        run: go tool task boot:buildkit

      - name: Build this change's QEMU and kernel, and the tools
        run: go tool task qemu:build kernel:build tools

      # The newest release, checked against its sha256 and its signature, as the machine before;
      # this change's machine is the same tree with what was just built in place of its own. The
      # steps after boot that tree: it is their SPIN_MACHINE_OUTPUT.
      - name: The machine before, and this one
        run: go tool task boot:here

      - name: Every ROM the machine maps is the fingerprint's
        run: go tool task boot:roms

      - name: A checkpoint of the release before resumes here
        run: go tool task boot:compat
