name: Compat

# Whether a checkpoint the newest release saved resumes on this change's machine, and whether the
# fingerprint still accounts for every ROM the machine maps (boot:compat, boot:roms): after every
# change on main to what a resumed guest is loaded into - the machine's definition, QEMU, the
# kernel, the firmware and their pins - and before every release.
#
# On the KVM fleet (spin-stack/ci), because it boots: the newest release is unpacked as the machine
# before, and the machine here is that tree with this change's QEMU, firmware and kernel built over
# it - the base image is the release's, since a checkpoint resumes with the disks it was saved
# with. The builds read the BuildKit cache main's lanes export (CACHE_BACKEND=gha), so a change
# that leaves QEMU and the kernel alone compiles neither.
#
# The test holds the promise only where it is made: when the two fingerprints differ the contract
# moved on purpose, the test says so and passes, and the release notes say it for the fleet.
#
# Not on a pull request: it is main's and a release's lane, and a branch is tried by dispatch
# before its pull request merges. It runs on main after a merge that touches the machine, and as
# a job release.yml waits for, so no release is published that a checkpoint of the one before it
# does not resume on.

on:
  push:
    branches: [main]
    paths:
      - machine/**
      - cmd/spin-machine/**
      - qemu/**
      - kernel/**
      - boot/compat_test.go
      - boot/roms_test.go
      - versions.yaml
      - .github/workflows/compat.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Per ref and never cancelled: a run on main is a commit somebody needs the answer for, and a
# release's waits on it. Called from release.yml it is the release's job and takes its group.
concurrency:
  group: compat-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  compat:
    runs-on: runs-on/fleet=kvm/env=production
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go's caches come back from the fleet's cache (its S3 bucket): the instance starts with
      # nothing.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A builder that can read a cache Docker's own cannot.
      - name: A BuildKit that reads the lanes' cache
        run: go tool task boot:buildkit

      # The tokens `type=gha` needs in a `run:` step; qemu.yml says why.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The guests' vsock transport: a module on the fleet's kernel that nothing loads before the
      # first QEMU opens /dev/vhost-vsock.
      - name: vsock
        run: sudo -n modprobe vhost_vsock

      # Reads the lanes' scopes and writes none back: main's lanes keep them current.
      - name: Build this change's QEMU and kernel, and the tools
        run: go tool task qemu:build kernel:build tools CACHE_BACKEND=gha CACHE_EXPORT=false

      # The newest release, checked against its sha256 and its signature, as the machine before;
      # this change's machine is the same tree with what was just built in place of its own. The
      # steps after boot that tree: it is their SPIN_MACHINE_OUTPUT.
      - name: The machine before, and this one
        run: go tool task boot:here

      - name: Every ROM the machine maps is the fingerprint's
        run: go tool task boot:roms

      - name: A checkpoint of the release before resumes here
        run: go tool task boot:compat
