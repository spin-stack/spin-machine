# Every day, the newest release of the guest kernel's series, proposed as a pull request
# (task refresh:kernel). A stable release is mostly fixes that were never called CVEs, or were
# called one after the fix was out, so taking them is the cheapest security this machine has:
# within the series the configuration does not change (kernel/config-<series>-x86_64) and
# checkpoints keep resuming, so a stable release is one versions.yaml line. kernel.yml builds it
# on the pull request; a person boots it and merges it. Nothing here publishes.
#
# The pull request is the release app's (spin-stack-release), so the checks on it run: one opened
# with this run's own token would start none.
name: Refresh

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

# As ci.yml: go-tools' downloads ask GitHub with it, which sheds anonymous ones first.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  kernel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: Iv23licJKNgsPIM00SD0 # spin-stack-release's client ID, public: app-id is deprecated
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: spin-stack
          repositories: spin-machine

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch is pushed as the app, below, and not with this run's token.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Commit as the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: go tool task git:app

      - name: Propose the kernel's newest release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: go tool task refresh:kernel
