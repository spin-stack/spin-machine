name: Report

# What every combination of the machine's features costs: a published release's tarball booted
# through the feature matrix (boot/report_test.go), written as report.json, and compared with the
# newest earlier release that has one.
#
# A workflow of its own because it boots: GitHub's runners have no /dev/kvm for it, and a time
# measured under emulation is not a time anybody's machine takes. The runner is one instance type,
# on purpose - the bench fleet of spin-stack/ci, a c8i.4xlarge with nested virtualization - since
# boot times compare only between reports taken on the same kind of host, and compare says so
# when they were not. It needs /dev/kvm and /dev/vhost-vsock usable by its user, sudo -n for
# modprobe nbd and qemu-nbd, and gh (docs/releasing.md).
#
# release.yml calls it with publish, which uploads report.json to the release and appends the
# comparison to its notes. Run by hand it measures any release - to check the runner, or to see
# a release against another - and keeps what it found as an artifact, touching no release.

on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
      ref: { type: string, required: true }
      publish: { type: boolean, default: false }
  workflow_dispatch:
    inputs:
      version:
        description: "The release to measure, e.g. v20260929.01"
        required: true
        type: string
      publish:
        description: "Upload report.json to that release and append the comparison to its notes"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  report:
    runs-on: runs-on/fleet=bench/env=production
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      # GitHub reads a workflow command (::error::) only at the start of a line, where Task's
      # prefixed output puts the task's name.
      TASK_OUTPUT: interleaved
    steps:
      # The harness from the ref asked for - the release's own tag when release.yml calls - and,
      # run by hand, from where the run was started: a release older than the report has none.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Go's caches come back from the fleet's cache (its S3 bucket): the instance starts with
      # nothing.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The guests' vsock transport, loaded and made this user's: a module on the fleet's kernel
      # that nothing loads before the first QEMU opens /dev/vhost-vsock.
      - name: Load vhost_vsock
        run: go tool task vsock

      # What this runner can do, said before anything is measured: a row the report skips is one
      # this host lacks the device for, and the summary says which before the report does.
      - name: What this runner has
        run: go tool task report:runner

      # The tarball as a consumer gets it, and not a tree a build left: what is measured is what
      # was published.
      - name: Unpack the release
        run: go tool task report:unpack

      - name: Measure the feature matrix
        run: go tool task report OUTPUT_DIR="$RELEASE_TREE" OUT="$PWD/_output/report/report.json"

      # Against the newest release before this one that has a report. The first release with
      # a report has nothing to compare with, and says so.
      - name: Compare with the release before it
        run: go tool task report:compare

      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ inputs.version }}
          path: |
            _output/report/report.json
            _output/report/compare.md
          if-no-files-found: error

      - name: Publish the report, and what moved
        if: inputs.publish
        run: go tool task report:publish
