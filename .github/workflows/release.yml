name: Release

# One tarball, one version, and the version names a day rather than a semantic promise.
#
# CalVer — v20260909.01 — because that is what a release of this repository is: the machine
# as it stood on a date. There is no API here to promise compatibility about, and the one
# thing a version could promise — that checkpoints still resume — is decided by the
# fingerprint of the artefacts and not by a number anybody chose. A major version bump
# would say something this repository cannot mean.
#
# The `.01` is the run within the day, because two releases on one day is normal when a
# flag is being chased.
#
# A release is made from main and nothing else: dispatched there, it names its version, builds,
# signs and attests as release.yml@refs/heads/main - the one identity whoever takes the release
# holds its files to - and only then tags the commit. A pushed tag starts nothing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v20260909.01. Left empty, one is generated for today."
        required: false
        type: string

permissions:
  contents: write
  # Keyless signing: cosign asks Sigstore for a short-lived certificate bound to this workflow at
  # this ref, which is what a machine that takes the release holds its files to.
  id-token: write

# One release at a time, across every ref, and not per-ref. Per-ref serialises two runs on
# the same tag and nothing else: a workflow_dispatch on main and a tag push are different
# refs, so both count the tags already taken today, both generate .01, and the loser finds
# out at `git tag`, after the whole build. The version is decided at the start of a run and
# pushed at the end, so that window is the whole build, and there is no reason to build two
# releases at once anyway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A checkpoint of the release before resumes on this one, when the two have one fingerprint,
  # and the fingerprint accounts for every ROM the machine maps: on the KVM runner, before
  # anything is built here to publish (compat.yml says why).
  compat:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/compat.yml

  release:
    needs: compat
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # A warm run reads main's BuildKit cache and takes a few minutes (2m13s, 2026-09-30). The
    # ceiling is for the cold one, which compiles QEMU and the kernel, each tens of minutes.
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # GitHub reads a workflow command (::error::) only at the start of a line, where Task's
      # prefixed output puts the task's name.
      TASK_OUTPUT: interleaved
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and the tags: the version below counts the tags already
          # taken today, and a shallow clone would count zero and hand out .01 twice.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Its own sticky disk, and not one of the lanes'. This job builds all four artefacts, so
      # it would want every lane's disk at once and can only have one — and a release can
      # overlap a lane, which sharing a key would make them contend for. The BuildKit scopes it
      # reads are still the lanes', so what main already compiled is not compiled again; see
      # the note in qemu.yml and CACHE_BACKEND in Taskfile.yml.
      # And no silent fallback, which matters most here: a release that compiled QEMU and the
      # kernel from cold because its builder quietly became a local one is hours, and it would
      # look like nothing but a slow release.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: spin-machine/release
          nofallback: true

      # Without this, `--cache-to type=gha` below is a silent no-op: the tokens BuildKit
      # needs reach JavaScript actions and not `run:` steps. See the long note in qemu.yml.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Two sources, in order: what the caller typed, or a new one for today. The generated form is deliberately not `date +%s` or a commit
      # hash — it has to be readable, sortable, and the same shape as one typed by hand.
      # The caller's input arrives through the environment and not through ${{ }} in the
      # script body. Interpolation happens before the shell sees the line, so a version
      # containing a quote or a semicolon would be pasted into the script rather than
      # assigned to a variable — and it is validated below, which is after that would have
      # mattered.
      - name: Decide the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: go tool task release:version

      # `task release` builds all four artefacts and packs them, ending in hack/release,
      # which refuses to produce a tarball with anything missing. A release that installs
      # and then fails for want of an option ROM is worse than no release.
      - name: Build the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # The same scopes the per-artefact workflows write on main, decided in
          # Taskfile.yml. That is the whole point of them being named there: a release
          # reads what the lane on main already paid to compile, instead of starting cold
          # because a workflow file spelled the scope differently.
          CACHE_BACKEND: gha
          # Reads what main's lanes exported and writes nothing back: a release is built once, and
          # the next one reads main's newer cache, not this. See CACHE_EXPORT in Taskfile.yml.
          CACHE_EXPORT: "false"
        run: go tool task release QEMU_JOBS=4 KERNEL_NPROC=4

      # The machine's identity, and what it costs whoever holds checkpoints.
      #
      # The alternative to hack/fingerprint-diff is opening two release pages and comparing
      # sixty-four hex digits by eye, which is a thing nobody does — so the answer to "why
      # did every checkpoint in the fleet stop resuming?" is one nobody has. The script
      # fetches the previous release's machine.env and states the consequence in a sentence,
      # at the top of the notes, where a consumer deciding whether to take this release
      # reads it.
      #
      # It exits 0 on every verdict: a changed machine is a release this repository makes on
      # purpose. The point is not to prevent it but to keep it from being quiet.
      - name: What this release is, and what it breaks
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: go tool task release:notes

      # v4 is the one that installs cosign v3. Dependabot moves this pin like every other `uses:`.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Who built each file and from what - this workflow at this commit, every pin in
      # versions.yaml - as SLSA provenance, beside the signature that says who made it. The
      # predicate has no clock in it, so it is the same for every file of the run.
      - name: Write the provenance
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: go tool task release:provenance

      # Each file is signed and attested, then each bundle checked against the identity that made
      # it, file by file: a bundle nothing verifies is a step that can quietly stop working.
      - name: Sign and attest what the release offers
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: go tool task release:sign

      # Tagged here, after the files are signed and before they are published, so that the next
      # run's count of "tags already taken today" is right and the tarball has a commit behind it.
      # A version tagged already is refused here: git push does not move a tag.
      - name: Tag the commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: go tool task release:tag

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.manifest.outputs.notes }}
          # machine.env is published on its own, and not only inside the tarball, so the
          # next release can read it back in a few hundred bytes and say whether it
          # strands the checkpoints taken against this one.
          files: |
            _output/release/*.tar.gz
            _output/release/*.tar.gz.sha256
            _output/release/machine.env
            _output/release/*.cdx.json
            _output/release/*.sigstore.json

  # What every combination of the machine's features costs, booted from the tarball just
  # published, as report.json beside it, and what moved against the release before it at the end
  # of the notes. report.yml says why it is a job of its own, on its own runner.
  report:
    needs: release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/report.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ needs.release.outputs.version }}
      publish: true
    secrets: inherit
