name: Lab

# One of the boot/ experiments, run on the bench fleet (spin-stack/ci, one instance type) against
# a published release: the same Task targets a developer runs, on a host that is doing nothing else.
#
# A workflow and not a laptop because a boot time is only worth comparing on a quiet host, and a
# developer's machine is not one: three runs of one kernel on one read 59.5, 96.8 and 167.7 ms
# (boot/bench_test.go), and 61 ms against 105 ms minutes apart on 2026-09-29, a hybrid CPU putting
# the vCPU on an efficiency core. The runner is the host report.yml measures releases on, so what
# an experiment finds compares with the releases' own reports.
#
# An experiment is a release plus, optionally, a build of a branch: kernel_run (and kernel_run_c)
# names a Kernel workflow run, qemu_run a QEMU one, and `variant` says whether the build boots
# beside the release's, interleaved - the only comparison this runner's minute-to-minute drift
# leaves honest - or instead of it, to check what it breaks. The probes that take a B say so in
# their test file.
#
# vars is `KEY=VALUE; KEY=VALUE`, each exported to the target: REPS, TOP, ONLY, FLAGS and the
# SPIN_* switches the target's test documents. A target that takes FLAGS (report, the firmware
# and initcall probes) adds them to every boot: `FLAGS=--bios bios-256k.bin` boots SeaBIOS, the
# fallback firmware. Only those
# names are taken, so a typo fails here rather than being ignored by the target. It is not a
# sandbox: Task templates some of them into shell commands, and whoever can dispatch this can
# push code that runs on the same runner.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "The boot/ target to run"
        required: true
        type: choice
        options:
          - boot:bench
          - boot:initcalls
          - boot:userspace
          - boot:systemd
          - boot:ssh-load
          - boot:page-cache
          - boot:firmware
          - boot:firmware-stages
          - report
      release:
        description: "The release to boot, e.g. v20260929.01 (default: the newest)"
        required: false
        type: string
      kernel_run:
        description: "A Kernel workflow run id whose vmlinux is compared against the release's (SPIN_KERNEL_B)"
        required: false
        type: string
      kernel_run_c:
        description: "A second Kernel workflow run id, compared as SPIN_KERNEL_C (boot:initcalls)"
        required: false
        type: string
      qemu_run:
        description: "A QEMU workflow run id whose QEMU and firmware are compared against the release's (SPIN_MACHINE_OUTPUT_B)"
        required: false
        type: string
      variant:
        description: "With a build to compare: boot it beside the release's, interleaved, or instead of it on every boot"
        required: false
        type: choice
        default: beside
        options:
          - beside
          - instead
      vars:
        description: "KEY=VALUE; KEY=VALUE for the target, e.g. REPS=20; TOP=40"
        required: false
        type: string

permissions:
  contents: read
  actions: read

# No concurrency group: the bench fleet runs one job at a time and queues the rest, and a group
# keeps one run pending and cancels the one before it, which lost two of three experiments
# queued back to back.

jobs:
  lab:
    runs-on: runs-on/fleet=bench/env=production
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      EXPERIMENT: ${{ inputs.experiment }}
      RELEASE: ${{ inputs.release }}
      KERNEL_RUN: ${{ inputs.kernel_run }}
      KERNEL_RUN_C: ${{ inputs.kernel_run_c }}
      QEMU_RUN: ${{ inputs.qemu_run }}
      VARS: ${{ inputs.vars }}
      # GitHub reads a workflow command (::error::) only at the start of a line, where Task's
      # prefixed output puts the task's name.
      TASK_OUTPUT: interleaved
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go's caches come back from the fleet's cache (its S3 bucket): the instance starts with
      # nothing.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The guests' vsock transport, loaded and made this user's: a module on the fleet's kernel
      # that nothing loads before the first QEMU opens /dev/vhost-vsock.
      - name: Load vhost_vsock
        run: go tool task vsock

      - name: Unpack the release
        run: go tool task lab:unpack

      # Another build to compare: a Kernel run's vmlinux (B, and C beside it) or a QEMU run's
      # QEMU and firmware. qemu.yml and kernel.yml build any branch on dispatch.
      - name: Fetch the builds to compare
        if: inputs.kernel_run != '' || inputs.kernel_run_c != '' || inputs.qemu_run != ''
        run: go tool task lab:fetch

      # beside: the build is booted interleaved with the release's own - SPIN_KERNEL_B and
      # SPIN_KERNEL_C for a kernel, and for QEMU a second release tree, SPIN_MACHINE_OUTPUT_B,
      # with the rest linked - the only comparison this runner's drift leaves honest.
      # instead: every boot is on the build, for report and boot:firmware, which check what a
      # change breaks rather than what it costs: the tree the experiment boots is the release
      # with the build in it.
      - name: Put the build where the experiment boots it
        if: inputs.kernel_run != '' || inputs.kernel_run_c != '' || inputs.qemu_run != ''
        env:
          VARIANT: ${{ inputs.variant }}
        run: go tool task lab:place

      - name: Take the variables
        run: go tool task lab:vars

      - name: What this run is
        env:
          VARIANT: ${{ inputs.variant }}
        run: go tool task lab:about

      # report writes its JSON where OUT says; the others print their tables through t.Log.
      - name: Run the experiment
        run: go tool task lab:run

      - name: What it found
        if: always()
        run: go tool task lab:found

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-${{ github.run_id }}
          path: |
            _output/lab/lab.log
            _output/lab/report.json
          if-no-files-found: ignore
