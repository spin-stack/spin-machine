name: Lab

# One of the boot/ experiments, run on the KVM runner against a published release: the same Task
# targets a developer runs, on a host that is doing nothing else.
#
# A workflow and not a laptop because a boot time is only worth comparing on a quiet host, and a
# developer's machine is not one: three runs of one kernel on one read 59.5, 96.8 and 167.7 ms
# (boot/bench_test.go), and 61 ms against 105 ms minutes apart on 2026-09-29, a hybrid CPU putting
# the vCPU on an efficiency core. The runner is the host report.yml measures releases on, so what
# an experiment finds compares with the releases' own reports.
#
# An experiment is a release plus, optionally, a kernel another workflow built: kernel_run names a
# Kernel workflow run (kernel.yml builds any branch on dispatch and uploads vmlinux-<sha>), and that
# kernel becomes SPIN_KERNEL_B, which boot:bench, boot:initcalls and report boot interleaved with
# the release's own - the only comparison this runner's minute-to-minute drift leaves honest.
#
# vars is `KEY=VALUE; KEY=VALUE`, each exported to the target: REPS, TOP, ONLY, FLAGS and the
# SPIN_* switches the target's test documents. Only those names are taken, so a typo fails here
# rather than being ignored by the target. It is not a sandbox: Task templates some of them into
# shell commands, and whoever can dispatch this can push code that runs on the same runner.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "The boot/ target to run"
        required: true
        type: choice
        options:
          - boot:bench
          - boot:initcalls
          - boot:userspace
          - boot:systemd
          - boot:unitload
          - boot:restore
          - boot:ssh-load
          - boot:kernel-pages
          - boot:memory-policy
          - boot:firmware
          - boot:firmware-stages
          - report
      release:
        description: "The release to boot, e.g. v20260929.01 (default: the newest)"
        required: false
        type: string
      kernel_run:
        description: "A Kernel workflow run id whose vmlinux is compared against the release's (SPIN_KERNEL_B)"
        required: false
        type: string
      kernel_run_c:
        description: "A second Kernel workflow run id, compared as SPIN_KERNEL_C (boot:initcalls)"
        required: false
        type: string
      qemu_run:
        description: "A QEMU workflow run id whose QEMU and firmware are compared against the release's (SPIN_MACHINE_OUTPUT_B)"
        required: false
        type: string
      vars:
        description: "KEY=VALUE; KEY=VALUE for the target, e.g. REPS=20; TOP=40"
        required: false
        type: string

permissions:
  contents: read
  actions: read

# No concurrency group: the runner takes one job at a time and queues the rest, and a group
# keeps one run pending and cancels the one before it, which lost two of three experiments
# queued back to back.

jobs:
  lab:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      EXPERIMENT: ${{ inputs.experiment }}
      RELEASE: ${{ inputs.release }}
      KERNEL_RUN: ${{ inputs.kernel_run }}
      KERNEL_RUN_C: ${{ inputs.kernel_run_c }}
      QEMU_RUN: ${{ inputs.qemu_run }}
      VARS: ${{ inputs.vars }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Unpack the release
        run: |
          set -euo pipefail
          if [ -z "$RELEASE" ]; then
            RELEASE=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          fi
          rm -rf _output/lab
          mkdir -p _output/lab/tmp
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p '*.tar.gz' -D _output/lab
          tar -xzf _output/lab/*.tar.gz -C _output/lab
          {
            echo "RELEASE=$RELEASE"
            echo "SPIN_MACHINE_OUTPUT=$PWD/_output/lab/spin-machine-${RELEASE}-linux-x86_64/usr/share/spin-stack"
            # On disk: the overlays go here, and cache=none is O_DIRECT, which tmpfs refuses.
            echo "TMPDIR=$PWD/_output/lab/tmp"
          } >> "$GITHUB_ENV"

      - name: Fetch the kernel to compare
        if: inputs.kernel_run != ''
        run: |
          set -euo pipefail
          [[ "$KERNEL_RUN" =~ ^[0-9]+$ ]] || { echo "::error::kernel_run is a run id, got: $KERNEL_RUN"; exit 1; }
          gh run download "$KERNEL_RUN" -R "$GITHUB_REPOSITORY" -p 'vmlinux-*' -D _output/lab/kernel-b
          k=$(find _output/lab/kernel-b -name vmlinux -type f | head -1)
          [ -n "$k" ] || { echo "::error::run $KERNEL_RUN has no vmlinux artifact"; exit 1; }
          echo "SPIN_KERNEL_B=$PWD/$k" >> "$GITHUB_ENV"

      - name: Fetch the third kernel
        if: inputs.kernel_run_c != ''
        run: |
          set -euo pipefail
          [[ "$KERNEL_RUN_C" =~ ^[0-9]+$ ]] || { echo "::error::kernel_run_c is a run id, got: $KERNEL_RUN_C"; exit 1; }
          gh run download "$KERNEL_RUN_C" -R "$GITHUB_REPOSITORY" -p 'vmlinux-*' -D _output/lab/kernel-c
          k=$(find _output/lab/kernel-c -name vmlinux -type f | head -1)
          [ -n "$k" ] || { echo "::error::run $KERNEL_RUN_C has no vmlinux artifact"; exit 1; }
          echo "SPIN_KERNEL_C=$PWD/$k" >> "$GITHUB_ENV"

      # The release with another build's QEMU and firmware - qemu.yml uploads both - as a
      # second tree beside it: the rest is linked, so a change to QEMU or qboot is measured
      # against the kernel and image it will ship with.
      - name: Fetch the QEMU to compare
        if: inputs.qemu_run != ''
        run: |
          set -euo pipefail
          [[ "$QEMU_RUN" =~ ^[0-9]+$ ]] || { echo "::error::qemu_run is a run id, got: $QEMU_RUN"; exit 1; }
          gh run download "$QEMU_RUN" -R "$GITHUB_REPOSITORY" -p 'qemu-*-linux-amd64' -D _output/lab/qemu-b
          q=$(find _output/lab/qemu-b -path '*/bin/qemu-system-x86_64' -type f | head -1)
          [ -n "$q" ] || { echo "::error::run $QEMU_RUN has no qemu-system-x86_64 artifact"; exit 1; }
          art=$(dirname "$(dirname "$q")")
          b=$PWD/_output/lab/release-b
          cp -as "$SPIN_MACHINE_OUTPUT" "$b"
          rm -rf "$b/bin/qemu-system-x86_64" "$b/qemu"
          install -m 0755 "$q" "$b/bin/qemu-system-x86_64"
          cp -r "$art/qemu" "$b/qemu"
          echo "SPIN_MACHINE_OUTPUT_B=$b" >> "$GITHUB_ENV"

      - name: Take the variables
        run: |
          set -euo pipefail
          IFS=';' read -ra pairs <<< "$VARS"
          for pair in "${pairs[@]}"; do
            pair="${pair#"${pair%%[![:space:]]*}"}"
            pair="${pair%"${pair##*[![:space:]]}"}"
            [ -z "$pair" ] && continue
            key="${pair%%=*}"
            [[ "$pair" == *=* && "$key" =~ ^(REPS|TOP|GAP|ONLY|FLAGS|CPUS|WS_MIB|MEMORY_MIB|DEBUG|GRAPH_[A-Z_]+|SHARE_[A-Z_]+|SPIN_[A-Z0-9_]+)$ ]] ||
              { echo "::error::not a variable this workflow passes on: $pair"; exit 1; }
            case "$key" in
              SPIN_MACHINE_OUTPUT|SPIN_MACHINE_OUTPUT_B|SPIN_KERNEL_B|SPIN_KERNEL_C) echo "::error::$key is set by this workflow"; exit 1 ;;
            esac
            echo "$pair" >> "$GITHUB_ENV"
          done

      # SPIN_LAB_KERNEL_B_EVERYWHERE=1: every boot on kernel B rather than beside it - for
      # report, whose matrix is the machine's whole contract, over a changed kernel.
      - name: Every boot on kernel B
        if: inputs.kernel_run != '' && contains(inputs.vars, 'SPIN_LAB_KERNEL_B_EVERYWHERE=1')
        run: echo "FLAGS=${FLAGS:+$FLAGS }--kernel $SPIN_KERNEL_B" >> "$GITHUB_ENV"

      # SPIN_LAB_QEMU_B_EVERYWHERE=1: every boot on qemu_run's QEMU and firmware rather than
      # beside them - for report and boot:firmware, which check what a change to either breaks.
      - name: Every boot on QEMU B
        if: inputs.qemu_run != '' && contains(inputs.vars, 'SPIN_LAB_QEMU_B_EVERYWHERE=1')
        run: |
          echo "SPIN_MACHINE_OUTPUT=$SPIN_MACHINE_OUTPUT_B" >> "$GITHUB_ENV"
          echo "SPIN_MACHINE_OUTPUT_B=" >> "$GITHUB_ENV"

      - name: What this run is
        run: |
          {
            echo "### $EXPERIMENT on $RUNNER_NAME"
            echo
            echo "- release: $RELEASE"
            echo "- kernel B: ${SPIN_KERNEL_B:+run $KERNEL_RUN}${SPIN_KERNEL_B:-none}"
            echo "- QEMU B: ${SPIN_MACHINE_OUTPUT_B:+run $QEMU_RUN}${SPIN_MACHINE_OUTPUT_B:-none}"
            echo "- vars: ${VARS:-none}"
            echo "- CPU: $(sed -n 's/^model name\s*: //p' /proc/cpuinfo | head -1), $(nproc) CPUs"
            echo "- load: $(cut -d' ' -f1-3 /proc/loadavg)"
            if sudo -n true 2>/dev/null; then echo "- sudo -n: yes"; else echo "- sudo -n: **no** (targets that edit an overlay skip)"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ -r /dev/kvm ] && [ -w /dev/kvm ] || { echo "::error::no usable /dev/kvm"; exit 1; }

      # SPIN_LAB_SEABIOS=1: every boot of the experiment on the SeaBIOS QEMU ships beside qboot,
      # the machine's firmware - for report, whose matrix is the machine's whole contract.
      - name: Every boot on SeaBIOS
        if: contains(inputs.vars, 'SPIN_LAB_SEABIOS=1')
        run: echo "FLAGS=${FLAGS:+$FLAGS }--bios bios-256k.bin" >> "$GITHUB_ENV"

      # A release tarball carries no spin-machine, and releaseDir skips without one: built from
      # this checkout into the tree, as report does through its tools dependency.
      - name: Build spin-machine into the release tree
        run: task tools OUTPUT_DIR="$SPIN_MACHINE_OUTPUT"

      # report writes its JSON where OUT says; the others print their tables through t.Log.
      # A skipped test exits 0, and a green run that measured nothing reads as a result, so a
      # skip fails the run with the test's reason.
      - name: Run the experiment
        run: |
          set -o pipefail
          task "$EXPERIMENT" OUTPUT_DIR="$SPIN_MACHINE_OUTPUT" OUT="$PWD/_output/lab/report.json" 2>&1 | tee _output/lab/lab.log
          if grep -q -- '--- SKIP' _output/lab/lab.log; then
            echo "::error::the experiment skipped: $(grep -B1 -- '--- SKIP' _output/lab/lab.log | head -1 | sed 's/^.*_test.go:[0-9]*: //')"
            exit 1
          fi

      - name: What it found
        if: always()
        run: |
          [ -f _output/lab/lab.log ] || exit 0
          {
            echo
            echo '```'
            grep -E '^\s{4}\S' _output/lab/lab.log | sed 's/^    //' | tail -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-${{ github.run_id }}
          path: |
            _output/lab/lab.log
            _output/lab/report.json
          if-no-files-found: ignore
