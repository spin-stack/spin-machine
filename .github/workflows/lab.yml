name: Lab

# One of the boot/ experiments, run on the KVM runner against a published release: the same Task
# targets a developer runs, on a host that is doing nothing else.
#
# A workflow and not a laptop because a boot time is only worth comparing on a quiet host, and a
# developer's machine is not one: three runs of one kernel on one read 59.5, 96.8 and 167.7 ms
# (boot/bench_test.go), and 61 ms against 105 ms minutes apart on 2026-09-29, a hybrid CPU putting
# the vCPU on an efficiency core. The runner is the host report.yml measures releases on, so what
# an experiment finds compares with the releases' own reports.
#
# An experiment is a release plus, optionally, a build of a branch: kernel_run (and kernel_run_c)
# names a Kernel workflow run, qemu_run a QEMU one, and `variant` says whether the build boots
# beside the release's, interleaved - the only comparison this runner's minute-to-minute drift
# leaves honest - or instead of it, to check what it breaks. The probes that take a B say so in
# their test file.
#
# vars is `KEY=VALUE; KEY=VALUE`, each exported to the target: REPS, TOP, ONLY, FLAGS and the
# SPIN_* switches the target's test documents. A target that takes FLAGS (report, the firmware
# and initcall probes) adds them to every boot: `FLAGS=--bios bios-256k.bin` boots SeaBIOS, the
# fallback firmware. Only those
# names are taken, so a typo fails here rather than being ignored by the target. It is not a
# sandbox: Task templates some of them into shell commands, and whoever can dispatch this can
# push code that runs on the same runner.

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "The boot/ target to run"
        required: true
        type: choice
        options:
          - boot:bench
          - boot:initcalls
          - boot:userspace
          - boot:systemd
          - boot:unitload
          - boot:ssh-load
          - boot:memory-policy
          - boot:firmware
          - boot:firmware-stages
          - report
      release:
        description: "The release to boot, e.g. v20260929.01 (default: the newest)"
        required: false
        type: string
      kernel_run:
        description: "A Kernel workflow run id whose vmlinux is compared against the release's (SPIN_KERNEL_B)"
        required: false
        type: string
      kernel_run_c:
        description: "A second Kernel workflow run id, compared as SPIN_KERNEL_C (boot:initcalls)"
        required: false
        type: string
      qemu_run:
        description: "A QEMU workflow run id whose QEMU and firmware are compared against the release's (SPIN_MACHINE_OUTPUT_B)"
        required: false
        type: string
      variant:
        description: "With a build to compare: boot it beside the release's, interleaved, or instead of it on every boot"
        required: false
        type: choice
        default: beside
        options:
          - beside
          - instead
      vars:
        description: "KEY=VALUE; KEY=VALUE for the target, e.g. REPS=20; TOP=40"
        required: false
        type: string

permissions:
  contents: read
  actions: read

# No concurrency group: the runner takes one job at a time and queues the rest, and a group
# keeps one run pending and cancels the one before it, which lost two of three experiments
# queued back to back.

jobs:
  lab:
    runs-on: [self-hosted, linux, x64, kvm]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      EXPERIMENT: ${{ inputs.experiment }}
      RELEASE: ${{ inputs.release }}
      KERNEL_RUN: ${{ inputs.kernel_run }}
      KERNEL_RUN_C: ${{ inputs.kernel_run_c }}
      QEMU_RUN: ${{ inputs.qemu_run }}
      VARS: ${{ inputs.vars }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Actions cache: this runner keeps Go's module and build caches on its own disk, and
      # the cache service only stored another copy per branch, against the repository's limit.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Unpack the release
        run: |
          set -euo pipefail
          if [ -z "$RELEASE" ]; then
            RELEASE=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          fi
          rm -rf _output/lab
          mkdir -p _output/lab/tmp
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p '*.tar.gz' -D _output/lab
          tar -xzf _output/lab/*.tar.gz -C _output/lab
          {
            echo "RELEASE=$RELEASE"
            echo "SPIN_MACHINE_OUTPUT=$PWD/_output/lab/spin-machine-${RELEASE}-linux-x86_64/usr/share/spin-stack"
            # On disk: the overlays and memory files go here, gigabytes a tmpfs /tmp holds in RAM.
            echo "TMPDIR=$PWD/_output/lab/tmp"
          } >> "$GITHUB_ENV"

      # Another build to compare: a Kernel run's vmlinux (B, and C beside it) or a QEMU run's
      # QEMU and firmware. qemu.yml and kernel.yml build any branch on dispatch.
      - name: Fetch the builds to compare
        if: inputs.kernel_run != '' || inputs.kernel_run_c != '' || inputs.qemu_run != ''
        run: |
          set -euo pipefail
          fetch() { # run, artifact pattern, directory
            [[ "$1" =~ ^[0-9]+$ ]] || { echo "::error::a run id is a number, got: $1"; exit 1; }
            gh run download "$1" -R "$GITHUB_REPOSITORY" -p "$2" -D "$3"
          }
          if [ -n "$KERNEL_RUN" ]; then fetch "$KERNEL_RUN" 'vmlinux-*' _output/lab/kernel-b; fi
          if [ -n "$KERNEL_RUN_C" ]; then fetch "$KERNEL_RUN_C" 'vmlinux-*' _output/lab/kernel-c; fi
          if [ -n "$QEMU_RUN" ]; then fetch "$QEMU_RUN" 'qemu-*-linux-amd64' _output/lab/qemu-b; fi

      # beside: the build is booted interleaved with the release's own - SPIN_KERNEL_B and
      # SPIN_KERNEL_C for a kernel, and for QEMU a second release tree, SPIN_MACHINE_OUTPUT_B,
      # with the rest linked - the only comparison this runner's drift leaves honest.
      # instead: every boot is on the build, for report and boot:firmware, which check what a
      # change breaks rather than what it costs: the tree the experiment boots is the release
      # with the build in it.
      - name: Put the build where the experiment boots it
        if: inputs.kernel_run != '' || inputs.kernel_run_c != '' || inputs.qemu_run != ''
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          one() { # the one file under $1 whose path matches $2
            f=$(find "$1" -path "$2" -type f | head -1)
            [ -n "$f" ] || { echo "::error::$1 has no $2"; exit 1; }
            echo "$PWD/$f"
          }
          b=$PWD/_output/lab/release-b
          tree_b() { [ -d "$b" ] || cp -as "$SPIN_MACHINE_OUTPUT" "$b"; }
          if [ -n "$KERNEL_RUN" ]; then
            k=$(one _output/lab/kernel-b '*/vmlinux')
            if [ "$VARIANT" = instead ]; then
              tree_b; rm -f "$b/kernel/vmlinux"; install -m 0644 "$k" "$b/kernel/vmlinux"
            else
              echo "SPIN_KERNEL_B=$k" >> "$GITHUB_ENV"
            fi
          fi
          if [ -n "$KERNEL_RUN_C" ]; then
            [ "$VARIANT" = beside ] || { echo "::error::kernel_run_c is a third kernel beside the release, not one to boot instead"; exit 1; }
            echo "SPIN_KERNEL_C=$(one _output/lab/kernel-c '*/vmlinux')" >> "$GITHUB_ENV"
          fi
          if [ -n "$QEMU_RUN" ]; then
            q=$(one _output/lab/qemu-b '*/bin/qemu-system-x86_64')
            tree_b; rm -rf "$b/bin/qemu-system-x86_64" "$b/qemu"
            install -m 0755 "$q" "$b/bin/qemu-system-x86_64"
            cp -r "$(dirname "$(dirname "$q")")/qemu" "$b/qemu"
            [ "$VARIANT" = instead ] || echo "SPIN_MACHINE_OUTPUT_B=$b" >> "$GITHUB_ENV"
          fi
          if [ "$VARIANT" = instead ]; then echo "SPIN_MACHINE_OUTPUT=$b" >> "$GITHUB_ENV"; fi

      - name: Take the variables
        run: |
          set -euo pipefail
          IFS=';' read -ra pairs <<< "$VARS"
          for pair in "${pairs[@]}"; do
            pair="${pair#"${pair%%[![:space:]]*}"}"
            pair="${pair%"${pair##*[![:space:]]}"}"
            [ -z "$pair" ] && continue
            key="${pair%%=*}"
            [[ "$pair" == *=* && "$key" =~ ^(REPS|TOP|GAP|ONLY|FLAGS|CPUS|MEMORY_MIB|DEBUG|GRAPH_[A-Z_]+|SHARE_[A-Z_]+|SPIN_[A-Z0-9_]+)$ ]] ||
              { echo "::error::not a variable this workflow passes on: $pair"; exit 1; }
            case "$key" in
              SPIN_MACHINE_OUTPUT|SPIN_MACHINE_OUTPUT_B|SPIN_KERNEL_B|SPIN_KERNEL_C) echo "::error::$key is set by this workflow"; exit 1 ;;
            esac
            echo "$pair" >> "$GITHUB_ENV"
          done

      - name: What this run is
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          {
            echo "### $EXPERIMENT on $RUNNER_NAME"
            echo
            echo "- release: $RELEASE"
            echo "- kernel B: ${KERNEL_RUN:+run }${KERNEL_RUN:-none}"
            echo "- kernel C: ${KERNEL_RUN_C:+run }${KERNEL_RUN_C:-none}"
            echo "- QEMU B: ${QEMU_RUN:+run }${QEMU_RUN:-none}"
            if [ -n "$KERNEL_RUN$KERNEL_RUN_C$QEMU_RUN" ]; then echo "- booted: $VARIANT the release"; fi
            echo "- vars: ${VARS:-none}"
            echo "- CPU: $(sed -n 's/^model name\s*: //p' /proc/cpuinfo | head -1), $(nproc) CPUs"
            echo "- load: $(cut -d' ' -f1-3 /proc/loadavg)"
            if sudo -n true 2>/dev/null; then echo "- sudo -n: yes"; else echo "- sudo -n: **no** (targets that edit an overlay skip)"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ -r /dev/kvm ] && [ -w /dev/kvm ] || { echo "::error::no usable /dev/kvm"; exit 1; }

      # report writes its JSON where OUT says; the others print their tables through t.Log.
      # A skipped test exits 0, and a green run that measured nothing reads as a result, so a
      # skip fails the run with the test's reason.
      - name: Run the experiment
        run: |
          set -o pipefail
          task "$EXPERIMENT" OUTPUT_DIR="$SPIN_MACHINE_OUTPUT" OUT="$PWD/_output/lab/report.json" 2>&1 | tee _output/lab/lab.log
          if grep -q -- '--- SKIP' _output/lab/lab.log; then
            echo "::error::the experiment skipped: $(grep -B1 -- '--- SKIP' _output/lab/lab.log | head -1 | sed 's/^.*_test.go:[0-9]*: //')"
            exit 1
          fi

      - name: What it found
        if: always()
        run: |
          [ -f _output/lab/lab.log ] || exit 0
          {
            echo
            echo '```'
            grep -E '^\s{4}\S' _output/lab/lab.log | sed 's/^    //' | tail -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lab-${{ github.run_id }}
          path: |
            _output/lab/lab.log
            _output/lab/report.json
          if-no-files-found: ignore
