name: QEMU

# QEMU takes tens of minutes to build from source, far too slow for the per-push gate. So
# it is its own workflow, triggered only by the files that can change the artefact.
#
# The build ends in `task qemu:verify`, and the Dockerfile carries assertions of its own,
# so a configuration that lost a device or produced the wrong accelerator fails here rather
# than in a VM that will not start weeks later.

on:
# qemu/** and nothing else. The version pin is the ARG in qemu/Dockerfile, so a bump is a
# change under qemu/ and fires this; the root Taskfile holds only how many jobs to compile
# with and which cache to use, and used to be listed here — which meant every edit to it
# rebuilt QEMU, the kernel and the base image for nothing.
  push:
    branches: [main]
    paths:
      - qemu/**
      - .github/workflows/qemu.yml
  pull_request:
    paths:
      - qemu/**
      - .github/workflows/qemu.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qemu-${{ github.head_ref || github.ref_name }}
  # Never on main: a cancelled run there is a commit nobody proved.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build is tens of minutes and a warm one is a cache restore, so the spread is
    # wide and the ceiling has to sit above the cold case. What it is really for is the
    # other end: a `configure` that stops on a prompt would hold a runner for six hours
    # without ever printing a failure.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Task
        uses: go-task/setup-task@v2

      # For the acceptance check at the end, which is a Go test. The runner's own Go is
      # whatever the image happens to carry, and go.mod names the one this builds with.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The pinned version comes from the Taskfile, never from a literal here: two places
      # to bump is how CI and production end up on different QEMUs.
      #
      # --output interleaved, and it is not optional: the Taskfile sets `output: prefixed`
      # so that a long build says which task each line came from, and that prefix is
      # applied to *this* task's output too. Captured, the version becomes
      # `[qemu:version] 11.1.1`, which reached the artifact name and failed the upload:
      #
      #   Error: The artifact name is not valid: qemu-[qemu:version] 11.1.1-linux-amd64.
      - name: Read the pinned QEMU version
        id: qemu
        run: echo "version=$(task --output interleaved qemu:version)" >> "$GITHUB_OUTPUT"

      - name: Build QEMU and verify what came out
        run: |
          task qemu:build \
            QEMU_CACHE_FROM=type=gha \
            QEMU_CACHE_TO=type=gha,mode=max \
            QEMU_JOBS=4

      # vhost-vsock is a kernel module, and the machine's vsock device cannot be created
      # without /dev/vhost-vsock. The runner has the node and gives the user no access to
      # it, which is why the chmod is not decoration: without it QEMU says "Could not open
      # '/dev/vhost-vsock': Permission denied" and the device goes unchecked. Loaded rather than stood in for: there is no backend that
      # keeps the device line and drops the requirement, and a runner without it is told
      # what went unchecked instead of being shown a pass.
      - name: Load vhost_vsock
        run: |
          sudo modprobe vhost_vsock && sudo chmod 0666 /dev/vhost-vsock ||
            echo "no vhost_vsock here; the check will name vhost-vsock-pci as unchecked"

      # The other half of what a device allowlist decides. `task qemu:build` ends in
      # qemu:verify, which asks this binary which accelerators and firmware files it has;
      # this asks whether it accepts the command line the machine package builds, which is
      # where a device removed from qemu/devices.mak actually surfaces — as a VM that does
      # not start, weeks later, reading like a fault in whatever launched it.
      #
      # ci.yml runs the same check on every push, against the published binary. This is the
      # lane that catches a change made on *this* side, before the binary it would break is
      # published at all.
      - name: Check the built QEMU accepts the machine's arguments
        run: task verify:args

      - name: Upload the extracted binaries
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ steps.qemu.outputs.version }}-linux-amd64
          path: |
            _output/bin/
            _output/qemu/
          retention-days: 30
          if-no-files-found: error

      # Publishing is skipped for pull requests: a fork's token cannot write packages, and
      # an unreviewed branch has no business claiming the version tag.
      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime image: a distribution channel for consumers that pull images rather
      # than tarballs. The binaries are static, so the image around them carries nothing
      # they need — which is the difference from when this was the only way to run them.
      #
      # Two tags: the QEMU version, which is what everything pins, and the commit, which is
      # what makes a specific build reachable when the version tag has moved because a flag
      # changed.
      - name: Publish the runtime image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --file qemu/Dockerfile \
            --target runtime \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg QEMU_VERSION=${{ steps.qemu.outputs.version }} \
            --build-arg JOBS=4 \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag ghcr.io/${{ github.repository }}/qemu:${{ steps.qemu.outputs.version }} \
            --tag ghcr.io/${{ github.repository }}/qemu:${{ github.sha }} \
            --push \
            .
