name: QEMU

# QEMU takes tens of minutes to build from source, far too slow for the per-push gate. So
# it is its own workflow, triggered only by the files that can change the artefact.
#
# The build ends in `task qemu:verify`, and the Dockerfile carries assertions of its own,
# so a configuration that lost a device or produced the wrong accelerator fails here rather
# than in a VM that will not start weeks later.

on:
# qemu/**, and versions.yaml with the tool that reads it, because that is where the pins are.
# The root Taskfile is deliberately not listed: it holds only how many jobs to compile with and
# which cache to use, so listing it would rebuild QEMU, the kernel and the base image for an
# edit that cannot change any of them.
#
# versions.yaml is listed by every lane that builds from it, and a path filter cannot tell a
# QEMU bump from an e2fsprogs one. The `changed` job below can: hack/touches compares what the
# QEMU build is handed at the base and here, and the build is skipped when the change does not
# reach it. It is given these paths but versions.yaml, and a change to any of them builds.
  push:
    branches: [main]
    paths:
      - qemu/**
      - versions.yaml
      - versions/**
      - go.mod
      - .github/workflows/qemu.yml
  pull_request:
    paths:
      - qemu/**
      - versions.yaml
      - versions/**
      - go.mod
      - .github/workflows/qemu.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qemu-${{ github.head_ref || github.ref_name }}
  # Never on main: a cancelled run there is a commit nobody proved.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # Whether this change can reach QEMU at all; see the note on the triggers. Skipped, the build
  # job reports as skipped, which a required check counts as passed.
  changed:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      build: ${{ steps.touches.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit has to be here to be compared against.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Does the change reach QEMU
        id: touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          build=$(hack/touches "$BASE" alpine qemu -- \
            qemu versions go.mod .github/workflows/qemu.yml)
          echo "build=${build}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # A cold build is tens of minutes and a warm one is a cache restore, so the spread is
    # wide and the ceiling has to sit above the cold case. What it is really for is the
    # other end: a `configure` that stops on a prompt would hold a runner for six hours
    # without ever printing a failure.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      # For the acceptance check at the end, which is a Go test. The runner's own Go is
      # whatever the image happens to carry, and go.mod names the one this builds with.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # cache-key is required as of v2 and names the sticky disk the builder keeps its state
      # on, so it is one key per thing built, for the same reason the BuildKit scopes in
      # Taskfile.yml are: share one and each build is handed the last one's disk and starts by
      # discarding it.
      #
      # nofallback, because the default is to degrade. A builder that cannot be set up
      # otherwise reports the error, falls back to a local one and carries on, so the run goes
      # green having lost the disk — which is how v2's new required input arrived unnoticed.
      # The cost of this is that an outage at a third party turns the lane red instead of
      # making it slow, which is the trade this repository makes everywhere else: a build that
      # did not do what it says is worth more as a failure than as a warning nobody reads.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: spin-machine/qemu
          nofallback: true

      # What makes `--cache-to type=gha` do anything at all.
      #
      # BuildKit writes to GitHub's cache service with $ACTIONS_RUNTIME_TOKEN and
      # $ACTIONS_RESULTS_URL, and those are handed to JavaScript actions, not to `run:`
      # steps. Docker's documentation is explicit — "If you invoke the `docker buildx`
      # command manually from an inline step, then the variables must be manually exposed"
      # — and names this action for it. Every build here runs through `task`, which is a
      # `run:` step.
      #
      # Without it the flags are accepted, nothing is stored, and nothing says so: the
      # builds pass and take the cold time, every run. That failure is invisible in a log.
      # Where it shows is `gh api repos/{owner}/{repo}/actions/cache/usage` — a repository
      # that builds QEMU and a kernel and reports a handful of megabytes is caching neither.
      #
      # Remove this step and nothing breaks; everything just gets slow again.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # The pinned version comes from the Taskfile, never from a literal here: two places
      # to bump is how CI and production end up on different QEMUs.
      #
      # --output interleaved, and it is not optional: the Taskfile sets `output: prefixed`
      # so that a long build says which task each line came from, and that prefix is
      # applied to *this* task's output too. Captured, the version becomes
      # `[qemu:version] 11.1.1`, which reached the artifact name and failed the upload:
      #
      #   Error: The artifact name is not valid: qemu-[qemu:version] 11.1.1-linux-amd64.
      - name: Read the pinned QEMU version
        id: qemu
        run: echo "version=$(task --output interleaved qemu:version)" >> "$GITHUB_OUTPUT"

      - name: Build QEMU and verify what came out
        run: |
          CACHE_BACKEND=gha task qemu:build QEMU_JOBS=4

      # vhost-vsock is a kernel module, and the machine's vsock device cannot be created
      # without /dev/vhost-vsock. The runner has the node and gives the user no access to
      # it, which is why the chmod is not decoration: without it QEMU says "Could not open
      # '/dev/vhost-vsock': Permission denied" and the device goes unchecked. Loaded rather than stood in for: there is no backend that
      # keeps the device line and drops the requirement, and a runner without it is told
      # what went unchecked instead of being shown a pass.
      - name: Load vhost_vsock
        run: |
          sudo modprobe vhost_vsock && sudo chmod 0666 /dev/vhost-vsock ||
            echo "no vhost_vsock here; the check will name vhost-vsock-pci as unchecked"

      # The other half of what a device allowlist decides. `task qemu:build` ends in
      # qemu:verify, which asks this binary which accelerators and firmware files it has;
      # this asks whether it accepts the command line the machine package builds, which is
      # where a device removed from qemu/devices.mak actually surfaces — as a VM that does
      # not start, weeks later, reading like a fault in whatever launched it.
      #
      # ci.yml runs the same check on every push, against the published binary. This is the
      # lane that catches a change made on *this* side, before the binary it would break is
      # published at all.
      - name: Check the built QEMU accepts the machine's arguments
        run: task verify:args

      # The other thing a changed QEMU binary is: a different machine. It is hashed by
      # content into the fingerprint exactly as the kernel is, so a configure flag added
      # here, or a device removed from devices.mak, stops every template in the fleet from
      # matching. Compared against the last released machine.env and reported; never a
      # failure, since changing the machine is a thing that gets done on purpose.
      #
      # The TCG binary is deliberately not compared. It is not part of a machine's identity
      # and must never run a machine a KVM guest will later restore from.
      - name: What this QEMU is, and what it breaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          qemu=$(sha256sum _output/bin/qemu-system-x86_64 | cut -d' ' -f1)
          echo "qemu sha256: ${qemu}"
          hack/fingerprint-diff "qemu_sha256=${qemu}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the extracted binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-${{ steps.qemu.outputs.version }}-linux-amd64
          path: |
            _output/bin/
            _output/qemu/
          retention-days: 30
          if-no-files-found: error

      # Publishing is skipped for pull requests: a fork's token cannot write packages, and
      # an unreviewed branch has no business claiming the version tag.
      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime image: a distribution channel for consumers that pull images rather
      # than tarballs. The binaries are static, so the image around them carries nothing
      # they need — which is the difference from when this was the only way to run them.
      #
      # Two tags: the QEMU version, which is what everything pins, and the commit, which is
      # what makes a specific build reachable when the version tag has moved because a flag
      # changed.
      #
      # Two --cache-from and one --cache-to, which is not symmetry gone wrong. This target
      # sits on top of the builder stage the step above just compiled, so it reads the
      # `qemu` scope to get it and writes only its own — sharing one scope would have the
      # two builds overwriting each other's cache, which is the default behaviour that made
      # every scope in this repository distinct in the first place.
      - name: Publish the runtime image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --file qemu/Dockerfile \
            --target runtime \
            --platform linux/amd64 \
            --cache-from type=gha,scope=qemu \
            --cache-from type=gha,scope=qemu-image \
            --cache-to type=gha,scope=qemu-image,mode=max \
            $(go tool versions args alpine qemu) \
            --build-arg JOBS=4 \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag ghcr.io/${{ github.repository }}/qemu:${{ steps.qemu.outputs.version }} \
            --tag ghcr.io/${{ github.repository }}/qemu:${{ github.sha }} \
            --push \
            .
