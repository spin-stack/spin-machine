name: QEMU

# QEMU takes tens of minutes to build from source, far too slow for the per-push gate. So
# it is its own workflow, triggered only by the files that can change the artefact.
#
# The build ends in `task qemu:verify`, and the Dockerfile carries assertions of its own,
# so a configuration that lost a device or produced the wrong accelerator fails here rather
# than in a VM that will not start weeks later.

on:
  push:
    branches: [main]
    paths:
      - qemu/**
      - Taskfile.yml # the version pin and the cache backends live here
      - .github/workflows/qemu.yml
  pull_request:
    paths:
      - qemu/**
      - Taskfile.yml
      - .github/workflows/qemu.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qemu-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build is tens of minutes and a warm one is a cache restore, so the spread is
    # wide and the ceiling has to sit above the cold case. What it is really for is the
    # other end: a `configure` that stops on a prompt would hold a runner for six hours
    # without ever printing a failure.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The pinned version comes from the Taskfile, never from a literal here: two places
      # to bump is how CI and production end up on different QEMUs.
      - name: Read the pinned QEMU version
        id: qemu
        run: echo "version=$(task qemu:version)" >> "$GITHUB_OUTPUT"

      - name: Build QEMU and verify what came out
        run: |
          task qemu:build \
            QEMU_CACHE_FROM=type=gha \
            QEMU_CACHE_TO=type=gha,mode=max \
            QEMU_JOBS=4

      - name: Upload the extracted binaries
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ steps.qemu.outputs.version }}-linux-amd64
          path: |
            _output/bin/
            _output/share/
          retention-days: 30
          if-no-files-found: error

      # Publishing is skipped for pull requests: a fork's token cannot write packages, and
      # an unreviewed branch has no business claiming the version tag.
      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime image: a distribution channel for consumers that pull images rather
      # than tarballs. The binaries are static, so the image around them carries nothing
      # they need — which is the difference from when this was the only way to run them.
      #
      # Two tags: the QEMU version, which is what everything pins, and the commit, which is
      # what makes a specific build reachable when the version tag has moved because a flag
      # changed.
      - name: Publish the runtime image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --file qemu/Dockerfile \
            --target runtime \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg QEMU_VERSION=${{ steps.qemu.outputs.version }} \
            --build-arg JOBS=4 \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag ghcr.io/${{ github.repository }}/qemu:${{ steps.qemu.outputs.version }} \
            --tag ghcr.io/${{ github.repository }}/qemu:${{ github.sha }} \
            --push \
            .
