name: CI

# The gate that runs on everything. It deliberately builds none of the three artefacts:
# QEMU is tens of minutes, the kernel is tens of minutes, and the base image is 1.5 GB of
# apt. Each has its own workflow, triggered by the files that can change it. What is left
# here is fast and is the half that catches most mistakes — the machine definition, and
# whether the scripts and Taskfiles parse at all.
#
# It does pull one of them: the published QEMU of the pinned version, seconds rather than
# minutes, so that the command line this repository builds can be handed to the binary that
# has to accept it. See the step.

# A branch is tested through its pull request, and main when something lands on it. Not
# both: an unfiltered `push:` fires alongside `pull_request:` for every push to a branch
# that has one open, so every push started two identical runs and the concurrency group
# below killed one of them. That worked and cost a run each time — both started, both took
# a runner — and left a column of `cancelled` in the run list that reads like a fault.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch supersedes the run its predecessor started, because only the tip
# is worth a verdict. Never on main: a cancelled run there is a commit nobody proved, and
# two merges landing close together are two things to verify.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  # To read back the QEMU this commit pins, rather than build it. See the step.
  packages: read

jobs:
  gate:
    # The check main's ruleset requires, named Gate in every spin-stack repository.
    name: Gate
    runs-on: ubuntu-latest
    # A ceiling, not a budget. The default is six hours, and a `go test` that deadlocks
    # would hold a runner for all of them without printing a failure.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # task mutate diffs against the branch point, which a shallow clone does not have.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # `task lint` and `task test`, and not a list of steps: a second definition of what
      # the gate is, maintained in a workflow file, goes out of step with the first exactly
      # when a check is added.
      - name: Lint
        run: go tool task lint

      - name: Test the machine definition
        run: go tool task test

      # always(): a failed suite is when the per-function numbers are wanted.
      - name: Coverage summary
        if: always()
        run: go tool task coverage

      - name: Upload Go coverage HTML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.html
          retention-days: 7
          if-no-files-found: ignore

      # The tests are green; this asks what they would have refused. On a pull request the diff
      # is against what it merges into, on a push against what was there before.
      - name: What this change broke, and whether a test noticed
        env:
          BEFORE: ${{ github.event.before }}
        run: go tool task mutate

      # The steps below run spin-machine, so it has to exist. `task test` exercises the
      # machine package; only a build catches what the command around it does with it.
      - name: Build the tools
        run: go tool task tools

      # `task test` proves the machine package agrees with itself. The steps below ask the
      # QEMU binary, which is the half that can disagree: the device set is decided in
      # qemu/devices.mak and the device and property names are written out by hand in
      # machine/machine.go, and nothing connected the two. A dropped device, a property
      # renamed at a version bump, or a typo all produced the same thing — a VM that does
      # not start, found days later by whoever booted one.
      #
      # Here and not only in qemu.yml, which is the workflow that has a QEMU: qemu.yml
      # fires on qemu/** alone, so a change to machine/machine.go — the likeliest way to
      # get this wrong — never reaches it.
      - name: Log in to GitHub Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Seconds, against the tens of minutes this workflow deliberately does not spend:
      # the runtime image qemu.yml published for the version versions.yaml pins, unpacked
      # into the same _output/ tree a build would write.
      #
      # continue-on-error, for one case that is not a fault: a pull request that bumps the
      # pin asks for a version no one has published yet, because publishing happens from
      # main. That pull request moves qemu in versions.yaml, so qemu.yml builds the binary and
      # runs the very same check against it — which is why this may say so and stop, and the step
      # after it is skipped rather than run against some other QEMU. Any other pull failure
      # skips the check too, and shows as a failed step in the run.
      - name: Fetch the pinned QEMU
        id: qemu
        continue-on-error: true
        run: go tool task qemu:fetch

      # vhost-vsock is a kernel module, and the machine's vsock device cannot be created
      # without /dev/vhost-vsock. The runner has the node and gives the user no access to
      # it, which is why the chmod is not decoration: without it QEMU says "Could not open
      # '/dev/vhost-vsock': Permission denied" and the device goes unchecked. Loaded here rather than stood in for: there is no backend
      # that keeps the device line and drops the requirement, and a runner without it is
      # told what went unchecked instead of being shown a pass.
      - name: Load vhost_vsock
        if: steps.qemu.outcome == 'success'
        run: go tool task vsock

      - name: Check QEMU accepts the machine's arguments
        if: steps.qemu.outcome == 'success'
        run: go tool task verify:args
