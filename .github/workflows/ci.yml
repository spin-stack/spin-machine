name: CI

# The gate that runs on everything. It deliberately builds none of the three artefacts:
# QEMU is tens of minutes, the kernel is tens of minutes, and the base image is 1.5 GB of
# apt. Each has its own workflow, triggered by the files that can change it. What is left
# here is fast and is the half that catches most mistakes — the machine definition, and
# whether the scripts and Taskfiles parse at all.

# A branch is tested through its pull request, and main when something lands on it. Not
# both: an unfiltered `push:` fires alongside `pull_request:` for every push to a branch
# that has one open, so every push started two identical runs and the concurrency group
# below killed one of them. That worked and cost a run each time — both started, both took
# a runner — and left a column of `cancelled` in the run list that reads like a fault.
#
# It is also what the other three workflows here have always done; this one was the
# exception.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch supersedes the run its predecessor started, because only the tip
# is worth a verdict. Never on main: a cancelled run there is a commit nobody proved, and
# two merges landing close together are two things to verify.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # A ceiling, not a budget. The default is six hours, and a `go test` that deadlocks
    # would hold a runner for all of them without printing a failure.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      # `task lint` and `task test`, and not a list of steps: a second definition of what
      # the gate is, maintained in a workflow file, goes out of step with the first exactly
      # when a check is added.
      - name: Lint
        run: task lint

      - name: Test the machine definition
        run: task test

      # The debug initramfs is a static Go binary in a cpio, and the only thing that can
      # break it is the Go build — which is worth catching here rather than in whichever
      # boot first found itself with no /init.
      - name: Build the tools
        run: task tools
