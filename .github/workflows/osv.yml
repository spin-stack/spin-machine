name: OSV

# Every day, what OSV knows against the newest release's SBOM (task osv), and an issue for each
# finding nobody has been told of yet. A release's libraries are a commit's, and a vulnerability is
# published after the commit: nothing in a build can find it, only asking again later can.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: osv
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Scan the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: task osv

      # One issue a finding, by its title, ever: one closed - fixed, or judged not to matter - is
      # not opened again, and the same finding in the next release is the same issue.
      - name: Open an issue for each new finding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          known=$(gh issue list --state all --limit 1000 --json title -q '.[].title')
          while IFS=$'\t' read -r id pkg summary; do
            title="osv: ${id} in ${pkg}"
            if printf '%s\n' "$known" | grep -Fxq -- "$title"; then
              continue
            fi
            gh issue create --title "$title" --body "$(printf '%s\n\n%s is in the newest release'"'"'s SBOM (task osv). https://osv.dev/vulnerability/%s' "$summary" "$pkg" "$id")"
          done < _output/osv.tsv
