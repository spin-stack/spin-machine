name: OSV

# Every day, what OSV knows against the newest release's SBOM (task osv), and an issue for each
# package with findings, closed once a release has none. A release's libraries are a commit's, and a vulnerability is
# published after the commit: nothing in a build can find it, only asking again later can.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: osv
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Scan the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: go tool task osv

      # One issue a package, which a release closes once it has no finding in it; hack/osvissues
      # says why a package and not a finding.
      - name: Bring the issues to the findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: go tool task osv:issues
