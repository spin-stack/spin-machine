name: Kernel

# The guest kernel, for the same reason QEMU has its own workflow: compiling it is tens of
# minutes and the merge gate must not wait for it.
#
# It matters more than a build time, though. A changed kernel is a changed machine — the
# fingerprint hashes this binary by content — so every template taken against the previous
# one stops matching. The job prints the checksum of what it produced for exactly that
# reason: a config change whose effect nobody looked at is a fleet-wide event nobody
# noticed.

on:
# kernel/** and nothing else; see the note in qemu.yml.
  push:
    branches: [main]
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  pull_request:
    paths:
      - kernel/**
      - .github/workflows/kernel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.head_ref || github.ref_name }}
  # Never on main: a cancelled run there is a commit nobody proved.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Without this, `--cache-to type=gha` below is a silent no-op: the tokens BuildKit
      # needs reach JavaScript actions and not `run:` steps. See the long note in qemu.yml.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@v4

      # Ends in `task kernel:verify`, which opens the ELF and checks the Xen PVH notes
      # survived the strip. Without them QEMU has no entry point into this kernel and the
      # failure is a VM that does not start, in whichever lane boots one next.
      - name: Build the kernel
        run: |
          CACHE_BACKEND=gha task kernel:build KERNEL_NPROC=4

      # Compared, now, against the last released machine — which is the reference this step
      # used to say it did not have. It does: every release publishes its machine.env as an
      # asset, and the kernel's checksum is one of the two numbers in it that decide whether
      # a template still matches.
      #
      # So a pull request that changes the config, or bumps the Debian toolchain the kernel
      # is compiled with, says on its own summary that it invalidates every template in
      # existence. That is not a reason to reject it — it is a release this repository makes
      # deliberately, and the step exits 0 either way — but it was previously a sentence
      # nobody wrote down, and the last time it happened it was a comment in this directory's
      # Dockerfile that nobody expected to rebuild anything.
      #
      # It speaks only for the kernel: this workflow builds no QEMU, and the verdict says so
      # rather than implying it checked the whole machine.
      - name: What this kernel is, and what it breaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kernel=$(sha256sum _output/kernel/vmlinux | cut -d' ' -f1)
          echo "kernel sha256: ${kernel}"
          echo "config sha256: $(sha256sum _output/kernel/kernel-config | cut -d' ' -f1)"
          hack/fingerprint-diff "kernel_sha256=${kernel}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the kernel
        uses: actions/upload-artifact@v7
        with:
          name: vmlinux-${{ github.sha }}
          path: |
            _output/kernel/vmlinux
            _output/kernel/kernel-config
          retention-days: 30
          if-no-files-found: error
