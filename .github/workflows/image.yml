name: Base image

# The base image: ~1.5 GB of apt against a live archive, so it is path-triggered like the
# other two rather than run on every push.
#
# The build runs `docker run --cap-add SYS_ADMIN` and not `docker buildx build`, because
# mkosi assembles a root filesystem by unsharing a user and mount namespace and BuildKit
# forbids it. See image/Dockerfile — the alternative was a buildkitd started with an
# entitlement flag, which would make the build depend on how the runner's builder was
# created.

on:
# image/** and e2fsprogs/**, which makes the filesystem, and versions.yaml when it moves one of
# their pins; see the note in qemu.yml.
  push:
    branches: [main]
    paths:
      - image/**
      - e2fsprogs/**
      - versions.yaml
      - versions/**
      - go.mod
      - .github/workflows/image.yml
  pull_request:
    paths:
      - image/**
      - e2fsprogs/**
      - versions.yaml
      - versions/**
      - go.mod
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.head_ref || github.ref_name }}
  # Never on main: a cancelled run there is a commit nobody proved.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # Whether this change can reach e2fsprogs or the image; see the note in qemu.yml.
  changed:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      build: ${{ steps.touches.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Does the change reach the image
        id: touches
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          build=$(hack/touches "$BASE" alpine e2fsprogs ubuntu mkosi -- \
            image e2fsprogs versions go.mod .github/workflows/image.yml)
          echo "build=${build}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Taskfiles hand the builds their pins with `go tool versions`.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      # One sticky disk per thing built, and no silent fallback; see the note in qemu.yml. This
      # job builds e2fsprogs and the image builder, which is one job and so one disk.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: spin-machine/image
          nofallback: true

      # Without this, `--cache-to type=gha` below is a silent no-op: the tokens BuildKit
      # needs reach JavaScript actions and not `run:` steps. See the long note in qemu.yml.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # image/build.sh asserts what came out on the finished filesystem rather than
      # trusting the build that made it: that there is an /sbin/init and a /bin/sh, that
      # the directories the guest mounts over exist, that no identity is baked in, and
      # that the units masked for measured reasons are still masked. A package upgrade
      # that undoes one of those fails here.
      # mkosi's own package cache is deliberately not restored between runs. It is ~1.5 GB
      # of .debs, and saving and restoring that costs about what downloading it costs — so
      # it would buy minutes of cache traffic in exchange for minutes of archive traffic,
      # and a cache entry large enough to push others out of the repository's 10 GB.
      # The image is made and checked with the static e2fsprogs this repository builds, not
      # the build container's, and image/build.sh stops when it is not there.
      - name: Build e2fsprogs
        run: |
          CACHE_BACKEND=gha task e2fsprogs:build

      - name: Build the base image
        run: |
          CACHE_BACKEND=gha task image:build

      - name: What this image is
        run: |
          ls -la _output/image/rootfs.qcow2
          echo "sha256: $(sha256sum _output/image/rootfs.qcow2 | cut -d' ' -f1)"

      # Not uploaded as an artifact: it is ~860 MB and the release workflow rebuilds it
      # from the same inputs. What this job is for is finding out that it still builds and
      # still passes its own checks.
