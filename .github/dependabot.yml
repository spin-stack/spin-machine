# What is here is what Dependabot can actually see, and nothing else.
#
# Not here, on purpose: every pin the machine is built from. They are in versions.yaml - the
# base images by digest, the upstream tarballs by SHA-256, qboot by commit - and the Dockerfiles
# are handed them as build arguments with no default, so Dockerfile scanning finds nothing to
# bump. `task versions` says what is behind and `task bump NAME=...` moves one entry, resolving
# its pin with it; a bot that bumped a version without its hash would produce a build that fails
# on the checksum, at best. A bump of qemu, kernel, debian or debian-snapshot is a new machine
# and every template in existence stops matching, which is a decision and not a routine merge.
version: 2

updates:
  # Actions cannot change the machine: nothing they do reaches the QEMU binary,
  # the kernel or the initrd, so nothing they do reaches a fingerprint. These are
  # the updates that can be taken on their merits.
  #
  # Two groups, and the split is not tidiness. Grouped as one, a major arrived with
  # a handful of harmless bumps: setup-docker-builder v2 made `cache-key` required,
  # and a run without it does not stop — it reports the error, falls back to a local
  # builder and carries on, so the PR was green and the builds quietly lost their
  # cache. A major on its own is a PR with one changelog to read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # go-tools, whose versions command reads versions.yaml, and its YAML parser. A build tool's
  # dependencies: the machine package and spin-machine do not import them, and nothing they do
  # reaches an artefact.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
