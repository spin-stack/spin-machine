version: '3'

# QEMU. See qemu/Dockerfile for what is built and why the flags are what they are; the
# cache backends and OUTPUT_DIR are in the root Taskfile.yml, and the pins in versions.yaml.

# The pinned version, for the image tags. The build is handed it with its tarball's sha256 by
# `versions args`, never from here: a version overridden on the command line and a checksum
# that was not would be a build that fails on the checksum, at best.
vars:
  QEMU_VERSION:
    sh: go tool versions version qemu

  # Where the runtime image is published, which `fetch` below reads back. The tag is the
  # pinned version, so asking for this repository's QEMU and asking for the one this commit
  # says it runs are the same question.
  QEMU_PUBLISHED_IMAGE: ghcr.io/spin-stack/spin-machine/qemu

tasks:

  build:
    desc: "Build QEMU: qemu-system-x86_64 (KVM only), the TCG binary for CI, qemu-img and the firmware."
    cmds:
      # Emptied first: `--output type=local` writes files and removes none, so a binary or
      # a firmware blob this build no longer produces stays on disk, indistinguishable from
      # one it does. That is how a 331 MB firmware tree outlived the build that stopped
      # shipping it, and how a qemu-nbd would outlive the decision to stop shipping one.
      - rm -rf {{.OUTPUT_ABS}}/bin/qemu-* {{.OUTPUT_ABS}}/qemu {{.OUTPUT_ABS}}/sbom/qemu.apk
      - mkdir -p {{.OUTPUT_ABS}}
      - |
        docker buildx build \
          --file qemu/Dockerfile \
          --target extract \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          {{.QEMU_CACHE_TO}} \
          $({{.VERSIONS}} args alpine qemu debian debian-snapshot qboot) \
          --build-arg JOBS={{.QEMU_JOBS}} \
          --output type=local,dest={{.OUTPUT_ABS}} \
          .
      - task: verify

  verify:
    desc: Assert the extracted QEMU tree carries what every consumer needs.
    cmds:
      # Files, and then the binaries themselves — which is worth doing here and was not
      # possible before they were static: an extracted dynamic binary linked against the
      # build image's libraries died on a bare host, so this task could only stat files and
      # leave the behaviour to assertions inside the build. Now the tree that is extracted
      # is the tree that runs.
      - |
        set -euo pipefail
        for b in qemu-system-x86_64 qemu-system-x86_64-tcg qemu-img; do
          test -x {{.OUTPUT_ABS}}/bin/$b || {
            echo "missing {{.OUTPUT_ABS}}/bin/$b — run: task qemu:build" >&2; exit 1; }
        done
        # qemu-img is not a convenience: a container's writable layer is a qcow2 overlay
        # created by running it, so a release with the emulator and without it cannot give
        # a container anywhere to write.
        # pvh.bin is how -kernel enters a PVH ELF kernel, which is the only boot path here.
        # efi-virtio.rom is the option ROM of the one NIC this build keeps; a VM given a
        # virtio-net-pci without it does not start.
        # qboot.bin is the BIOS the machine boots with (machine.DefaultBIOS), built beside QEMU
        # from qemu/qboot/; 64 KiB is the ROM window it is linked for.
        for f in bios.bin bios-256k.bin pvh.bin kvmvapic.bin efi-virtio.rom qboot.bin; do
          test -f {{.OUTPUT_ABS}}/qemu/$f || {
            echo "missing firmware $f — run: task qemu:build" >&2; exit 1; }
        done
        test "$(stat -c%s {{.OUTPUT_ABS}}/qemu/qboot.bin)" -eq 65536 || {
          echo "qboot.bin is not 64 KiB" >&2; exit 1; }
        # Run, not just present. A binary that cannot start on the host that extracted it
        # is the failure static linking exists to remove, and it costs one exec to notice.
        for b in qemu-system-x86_64 qemu-system-x86_64-tcg qemu-img; do
          {{.OUTPUT_ABS}}/bin/$b --version > /dev/null || {
            echo "{{.OUTPUT_ABS}}/bin/$b does not run on this host" >&2; exit 1; }
        done
        # And the split, which is not visible in a file listing: the binary a tenant's host
        # runs must refuse to emulate, and the CI one must be able to. Backwards, this is a
        # fleet running at a tenth of the speed or a lane that cannot boot at all.
        ! {{.OUTPUT_ABS}}/bin/qemu-system-x86_64 -accel help | grep -qx tcg || {
          echo "qemu-system-x86_64 has TCG compiled in: a host with no /dev/kvm would emulate" >&2
          exit 1; }
        {{.OUTPUT_ABS}}/bin/qemu-system-x86_64-tcg -accel help | grep -qx tcg || {
          echo "qemu-system-x86_64-tcg cannot emulate, so a runner without /dev/kvm has nothing to boot with" >&2
          exit 1; }
        echo "OK: both qemu-system binaries run here, qemu-img runs, six firmware files,"
        echo "    and only the CI binary can emulate"
      # The versioned q35 every checkpoint is saved on (machine.MachineType), offered and not
      # deprecated by both binaries; a newer one is said here and in a release's notes, and is
      # not a failure: moving to it is a decision, not a side effect of a bump.
      - for: [qemu-system-x86_64, qemu-system-x86_64-tcg]
        cmd: go run ./hack/machinetype check -qemu {{.OUTPUT_ABS}}/bin/{{.ITEM}}

  version:
    desc: The pinned QEMU version, as version=, on the step's outputs in CI.
    cmds:
      - echo "version={{.QEMU_VERSION}}" >> "${GITHUB_OUTPUT:-/dev/stdout}"

  summary:
    desc: >-
      What the built QEMU is, and whether it still offers the machine type every checkpoint is
      saved on: on the run's summary in CI.
    cmds:
      - |
        set -euo pipefail
        {
          echo "qemu sha256: $(sha256sum {{.OUTPUT_ABS}}/bin/qemu-system-x86_64 | cut -d' ' -f1)"
          echo "qboot.bin: $(stat -c%s {{.OUTPUT_ABS}}/qemu/qboot.bin) bytes"
          go run ./hack/machinetype check -qemu {{.OUTPUT_ABS}}/bin/qemu-system-x86_64
        } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

  publish:
    desc: >-
      Build and push the runtime image, tagged with the pinned version, to GitHub's registry
      under GITHUB_REPOSITORY: what `fetch` pulls. Needs a docker login that can write packages.
    cmds:
      - |
        set -euo pipefail
        repo=${GITHUB_REPOSITORY:-spin-stack/spin-machine}
        docker buildx build \
          --file qemu/Dockerfile \
          --target runtime \
          --platform linux/amd64 \
          --cache-from type=gha,scope=qemu \
          $({{.VERSIONS}} args alpine qemu debian debian-snapshot qboot) \
          --build-arg JOBS=4 \
          --label org.opencontainers.image.source=https://github.com/${repo} \
          --tag ghcr.io/${repo}/qemu:{{.QEMU_VERSION}} \
          --push \
          .

  compat:
    desc: >-
      Print what QEMU's newer machine types change against the pinned one (machine.MachineType):
      hw_compat_X_Y and pc_compat_X_Y from the source of the pinned QEMU, checked against its
      sha256. task bump NAME=qemu runs it.
    cmds:
      - |
        set -euo pipefail
        eval "$({{.VERSIONS}} env qemu)"
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "$({{.VERSIONS}} url qemu)" -o "$tmp/qemu.tar.xz"
        echo "${QEMU_SHA256}  $tmp/qemu.tar.xz" | sha256sum -c - > /dev/null
        tar -xJf "$tmp/qemu.tar.xz" -C "$tmp" "qemu-${QEMU_VERSION}/hw/core/machine.c" "qemu-${QEMU_VERSION}/hw/i386/pc.c"
        go run ./hack/machinetype compat "$tmp/qemu-${QEMU_VERSION}/hw/core/machine.c" "$tmp/qemu-${QEMU_VERSION}/hw/i386/pc.c"

  fetch:
    desc: >-
      Put the published QEMU of the pinned version into _output/, instead of building it.
      Seconds against tens of minutes, and the same binaries — they are static, so the
      image around them carries nothing they need.
    cmds:
      # The same tree `build` writes, so whatever reads _output/ cannot tell which of the
      # two filled it. Emptied first for the reason build empties it: --output writes files
      # and removes none, and a firmware blob left over from another version is
      # indistinguishable from one this QEMU shipped.
      - rm -rf {{.OUTPUT_ABS}}/bin/qemu-* {{.OUTPUT_ABS}}/qemu
      - mkdir -p {{.OUTPUT_ABS}}/bin
      - |
        set -euo pipefail
        image="{{.QEMU_PUBLISHED_IMAGE}}:{{.QEMU_VERSION}}"
        docker pull --quiet --platform linux/amd64 "$image"
        # create/cp and not `docker run cat`: the image's entrypoint is qemu-system-x86_64,
        # and nothing has to start for a file to be copied out of a container that never ran.
        cid=$(docker create --platform linux/amd64 "$image")
        trap 'docker rm --force "$cid" > /dev/null' EXIT
        for b in qemu-system-x86_64 qemu-system-x86_64-tcg qemu-img; do
          docker cp "$cid:/usr/local/bin/$b" {{.OUTPUT_ABS}}/bin/$b
        done
        docker cp "$cid:/usr/share/spin-stack/qemu" {{.OUTPUT_ABS}}/qemu
      # Which asserts the fetched tree is whole and that both binaries run here — the same
      # question asked of a built one, and worth asking of a downloaded one twice over.
      - task: verify
