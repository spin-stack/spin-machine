version: '3'

# QEMU. See qemu/Dockerfile for what is built and why the flags are what they are; the
# vars these tasks read (QEMU_VERSION, the cache backends, OUTPUT_DIR) are in the root
# Taskfile.yml, which is where the version pin lives.

tasks:

  build:
    desc: "Build QEMU: qemu-system-x86_64 (KVM only), the TCG binary for CI, qemu-img and the firmware."
    cmds:
      # Emptied first: `--output type=local` writes files and removes none, so a binary or
      # a firmware blob this build no longer produces stays on disk, indistinguishable from
      # one it does. That is how a 331 MB firmware tree outlived the build that stopped
      # shipping it, and how a qemu-nbd would outlive the decision to stop shipping one.
      - rm -rf {{.OUTPUT_ABS}}/bin/qemu-* {{.OUTPUT_ABS}}/share/spin-stack/qemu
      - mkdir -p {{.OUTPUT_ABS}}
      - |
        docker buildx build \
          --file qemu/Dockerfile \
          --target extract \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          --cache-to {{.QEMU_CACHE_TO}} \
          --build-arg QEMU_VERSION={{.QEMU_VERSION}} \
          --build-arg JOBS={{.QEMU_JOBS}} \
          --output type=local,dest={{.OUTPUT_ABS}} \
          .
      - task: verify

  verify:
    desc: Assert the extracted QEMU tree carries what every consumer needs.
    cmds:
      # Files, and then the binaries themselves — which is worth doing here and was not
      # possible before they were static: an extracted dynamic binary linked against the
      # build image's libraries died on a bare host, so this task could only stat files and
      # leave the behaviour to assertions inside the build. Now the tree that is extracted
      # is the tree that runs.
      - |
        set -euo pipefail
        for b in qemu-system-x86_64 qemu-system-x86_64-tcg qemu-img; do
          test -x {{.OUTPUT_ABS}}/bin/$b || {
            echo "missing {{.OUTPUT_ABS}}/bin/$b — run: task qemu:build" >&2; exit 1; }
        done
        # qemu-img is not a convenience: a container's writable layer is a qcow2 overlay
        # created by running it, so a release with the emulator and without it cannot give
        # a container anywhere to write.
        # pvh.bin is how -kernel enters a PVH ELF kernel, which is the only boot path here.
        # efi-virtio.rom is the option ROM of the one NIC this build keeps; a VM given a
        # virtio-net-pci without it does not start.
        for f in bios.bin bios-256k.bin pvh.bin kvmvapic.bin efi-virtio.rom; do
          test -f {{.OUTPUT_ABS}}/share/spin-stack/qemu/$f || {
            echo "missing firmware $f — run: task qemu:build" >&2; exit 1; }
        done
        # Run, not just present. A binary that cannot start on the host that extracted it
        # is the failure static linking exists to remove, and it costs one exec to notice.
        for b in qemu-system-x86_64 qemu-system-x86_64-tcg qemu-img; do
          {{.OUTPUT_ABS}}/bin/$b --version > /dev/null || {
            echo "{{.OUTPUT_ABS}}/bin/$b does not run on this host" >&2; exit 1; }
        done
        # And the split, which is not visible in a file listing: the binary a tenant's host
        # runs must refuse to emulate, and the CI one must be able to. Backwards, this is a
        # fleet running at a tenth of the speed or a lane that cannot boot at all.
        ! {{.OUTPUT_ABS}}/bin/qemu-system-x86_64 -accel help | grep -qx tcg || {
          echo "qemu-system-x86_64 has TCG compiled in: a host with no /dev/kvm would emulate" >&2
          exit 1; }
        {{.OUTPUT_ABS}}/bin/qemu-system-x86_64-tcg -accel help | grep -qx tcg || {
          echo "qemu-system-x86_64-tcg cannot emulate, so a runner without /dev/kvm has nothing to boot with" >&2
          exit 1; }
        echo "OK: both qemu-system binaries run here, qemu-img runs, five firmware files,"
        echo "    and only the CI binary can emulate"

  image:
    desc: >-
      Build the QEMU runtime image locally (--load, not pushed). A convenience for
      consumers that would rather pull an image than a tarball — the binaries in it are the
      same static ones, and need nothing from the image around them.
    cmds:
      - |
        docker buildx build \
          --file qemu/Dockerfile \
          --target runtime \
          --platform linux/amd64 \
          --cache-from {{.QEMU_CACHE_FROM}} \
          --build-arg QEMU_VERSION={{.QEMU_VERSION}} \
          --build-arg JOBS={{.QEMU_JOBS}} \
          --tag {{.QEMU_IMAGE}}:{{.QEMU_VERSION}} \
          --load \
          .

  version:
    desc: Print the pinned QEMU version (the single source of truth for CI tags).
    # A caller capturing this needs `task --output interleaved qemu:version`. The root
    # Taskfile sets `output: prefixed` so a long build says which task each line came
    # from, and that decoration is applied here too — so the obvious `$(task qemu:version)`
    # yields `[qemu:version] 11.1.1`, which looks right in a terminal and is wrong
    # everywhere it is used.
    cmds:
      - echo "{{.QEMU_VERSION}}"
